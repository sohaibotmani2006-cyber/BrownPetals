        phone: <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        "message-circle": <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        x: <path d="M18 6L6 18M6 6l12 12" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        send: <path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        gem: (
          <g>
            <path d="M6 3h12l4 6-10 13L2 9z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M11 3L8 9l4 13 4-13-3-6" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />

        ),
        truck: (
          <g>
            <rect x="1" y="3" width="15" height="13" rx="2" ry="2" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <circle cx="5.5" cy="18.5" r="2.5" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <circle cx="18.5" cy="18.5" r="2.5" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />

            <path d="M12 5V22M3 12h18M12 5a3 3 0 10-3-3M12 5a3 3 0 113-3" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
          </g>
        ),
        "arrow-down": <path d="M12 5v14M19 12l-7 7-7-7" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />,
        "shield-check": (
          <g>
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M9 11l2 2 4-4" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />

        ),
        lock: (
          <g>
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />

        banknote: (
          <g>
            <rect x="2" y="6" width="20" height="12" rx="2" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />

          <g>

          </g>
        ),
        clock: (
          <g>
            <circle cx="12" cy="12" r="10" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <polyline points="12 6 12 12 16 14" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
          </g>
        ),
        "check-circle-2": (
          <g>
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M9 12l2 2 4-4" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
          </g>
        ),
        flower: (
          <g>
            <circle cx="12" cy="12" r="3" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M12 5a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M12 11a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M5 12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-3 3z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
            <path d="M11 12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-3 3z" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" />
          </g>

      };

      return (
        <svg
          className={className}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
        >
          {paths[name] || null}
        </svg>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminView, setAdminView] = useState("dashboard"); // "dashboard", "products", "orders", "reviews", "delivery", "categories", "lookbook"
      
      // Nav State
      const [currentPage, setCurrentPage] = useState("home"); // "home", "shop", "contact", "admin"
      const [cartOpen, setCartOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");

      // Core Data States
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [categories, setCategories] = useState([]);
      const [analytics, setAnalytics] = useState({
        dailyRevenue: 0,
        dailyOrders: 0,
        topProducts: [],
        topCategories: [],
      });

      // Cart Local State
      const [cart, setCart] = useState(() => {
        try {
          const savedCart = localStorage.getItem("bp_cart");
          return savedCart ? JSON.parse(savedCart) : [];
        } catch (e) {
          return [];
        }
      });

      // Feedback / Form States
      const [adminForm, setAdminForm] = useState({ username: "", password: "" });
      const [adminError, setAdminError] = useState("");
      const [addReviewForm, setAddReviewForm] = useState({ productId: "", customerName: "", rating: 5, comment: "", customerLocation: "Casablanca" });
      const [checkoutForm, setCheckoutForm] = useState({ customerName: "", phone: "", address: "", cityId: "" });
      const [checkoutLoading, setCheckoutLoading] = useState(false);
      const [homeReviewFormOpen, setHomeReviewFormOpen] = useState(false);

      // Delivery Cities State
      const [deliveryCities, setDeliveryCities] = useState([]);
      const [cityForm, setCityForm] = useState({ id: "", name: "", price: 0, isActive: true });
      const [isAddingCity, setIsAddingCity] = useState(false);

      // Lookbook State
      const [lookbook, setLookbook] = useState([]);
      const [lookbookForm, setLookbookForm] = useState({ id: "", imageURL: "", postURL: "" });
      const [isEditingLookbook, setIsEditingLookbook] = useState(false);

      // Category Management Forms
      const [categoryForm, setCategoryForm] = useState({ id: "", name: "", order: 1, isActive: true });
      const [isAddingCategory, setIsAddingCategory] = useState(false);

      // Product Management Forms
      const [productEditForm, setProductEditForm] = useState(null); // Null or Product Object to edit/add
      const [isAddingNewProduct, setIsAddingNewProduct] = useState(false);

      // Detail Modal & Gallery Preview Selected Image State
      const [selectedProductDetails, setSelectedProductDetails] = useState(null);
      const [activeImg, setActiveImg] = useState("");
      const [lightboxImg, setLightboxImg] = useState(null);
      const [imageFade, setImageFade] = useState(false);

      // Custom Safe Delete Confirmation Dialog state (Never use Native alert/confirm in dynamic frame)
      const [confirmDialog, setConfirmDialog] = useState({ show: false, title: "", message: "", onConfirm: null });

      // Alert Toast State
      const [toast, setToast] = useState({ show: false, message: "", type: "success" });

      const showToast = (message, type = "success") => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: "", type: "success" }), 3500);
      };

      const triggerConfirm = (title, message, onConfirmCallback) => {
        setConfirmDialog({
          show: true,
          title,
          message,
          onConfirm: () => {
            onConfirmCallback();
            setConfirmDialog({ show: false, title: "", message: "", onConfirm: null });
          }
        });
      };

      useEffect(() => {
        if (selectedProductDetails) {
          setActiveImg(selectedProductDetails.imageURL);
        }
      }, [selectedProductDetails]);

      const handleThumbnailClick = (imgUrl) => {
        if (imgUrl === activeImg) return;
        setImageFade(true);
        setTimeout(() => {
          setActiveImg(imgUrl);
          setImageFade(false);
        }, 180);
      };

      useEffect(() => {
        // Fade out and remove the HTML loading wrapper safely
        const preloader = document.getElementById('app-preloader');
        if (preloader) {
          preloader.style.opacity = '0';
          preloader.style.visibility = 'hidden';
          setTimeout(() => preloader.remove(), 400);
        }
      }, []);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (error) {
            console.error("Auth initialization failed:", error);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (usr) => {
          if (usr) {
            setUser(usr);
          }
        });
        return () => unsubscribe();
      }, []);

      // Save Cart Persistence
      useEffect(() => {
        localStorage.setItem("bp_cart", JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        if (!user) return;

        // Path definitions according to Strict Rule 1
        const productsCol = collection(db, 'artifacts', appId, 'public', 'data', 'products');
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const reviewsCol = collection(db, 'artifacts', appId, 'public', 'data', 'reviews');
        const citiesCol = collection(db, 'artifacts', appId, 'public', 'data', 'deliveryCities');
        const categoriesCol = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
        const analyticsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'analytics', 'live');

        // Products Listener
        const unsubProducts = onSnapshot(productsCol, (snapshot) => {
          const prodList = [];
          snapshot.forEach((doc) => {
            prodList.push({ id: doc.id, ...doc.data() });
          });
          if (prodList.length === 0) {
            seedInitialProducts();
          } else {
            setProducts(prodList);
          }
        }, (error) => {
          console.error("Products subscription error", error);
        });

        // Orders Listener
        const unsubOrders = onSnapshot(ordersCol, (snapshot) => {
          const ordList = [];
          snapshot.forEach((doc) => {
            ordList.push({ id: doc.id, ...doc.data() });
          });
          setOrders(ordList.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
        }, (error) => {
          console.error("Orders subscription error", error);
        });

        // Reviews Listener
        const unsubReviews = onSnapshot(reviewsCol, (snapshot) => {
          const revList = [];
          snapshot.forEach((doc) => {
            revList.push({ id: doc.id, ...doc.data() });
          });
          setReviews(revList.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
        }, (error) => {
          console.error("Reviews subscription error", error);
        });

        // Analytics Listener
        const unsubAnalytics = onSnapshot(analyticsDocRef, (docSnap) => {
          if (docSnap.exists()) {
            setAnalytics(docSnap.data());
          } else {
            // Seed base analytics
            setDoc(analyticsDocRef, {
              dailyRevenue: 28400,
              dailyOrders: 35,
              topProducts: ["Royal Majorelle Bouquet", "Imperial Sahara Gold Box"],
              topCategories: ["Flowers bouquet", "Flowers box"],
              updatedAt: serverTimestamp()
            });
          }
        }, (error) => {
          console.error("Analytics subscription error", error);
        });

        // Delivery Cities Listener
        const unsubCities = onSnapshot(citiesCol, (snapshot) => {
          const cityList = [];
          snapshot.forEach((doc) => {
            cityList.push({ id: doc.id, ...doc.data() });
          });
          if (cityList.length === 0) {
            seedInitialCities();
          } else {
            setDeliveryCities(cityList.sort((a,b) => a.name.localeCompare(b.name)));
          }
        }, (error) => {
          console.error("Cities subscription error", error);
        });

        // Categories Listener
        const unsubCategories = onSnapshot(categoriesCol, (snapshot) => {
          const catList = [];
          snapshot.forEach((doc) => {
            catList.push({ id: doc.id, ...doc.data() });
          });
          if (catList.length === 0) {
            seedInitialCategories();
          } else {
            setCategories(catList.sort((a, b) => (a.order || 0) - (b.order || 0)));
          }
        }, (error) => {
          console.error("Categories subscription error", error);
        });

        // Lookbook Listener
        const lookbookCol = collection(db, 'artifacts', appId, 'public', 'data', 'lookbook');
        const unsubLookbook = onSnapshot(lookbookCol, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            list.push({ id: doc.id, ...doc.data() });
          });
          if (list.length === 0) {
            seedInitialLookbook();
          } else {
            setLookbook(list);
          }
        }, (error) => {
          console.error("Lookbook subscription error", error);
        });

        return () => {
          unsubProducts();

                          <div className="flex justify-between items-start">
                            <h3 className="font-serif text-lg text-coffeeBrown group-hover:text-luxuryGold transition cursor-pointer" onClick={() => setSelectedProductDetails(product)}>

                            <div className="flex items-baseline gap-2">

                                <span className="text-lg font-bold text-darkBrown">{product.price} MAD</span>

                                Order Now
                              </button>
                            </div>
                          </div>
                        </div>

                      </div>
                    ))}
                  </div>
                )}

              </div>

            </div>

          </div>
        );
      }

      function renderAdminDashboard() {
        const nonCancelledOrders = orders.filter(o => o.status !== 'cancelled');
        const totalSales = nonCancelledOrders.reduce((sum, o) => sum + o.total, 0);
        const pendingOrdersCount = nonCancelledOrders.filter(o => o.status === 'pending').length;
        const processedOrdersCount = nonCancelledOrders.filter(o => o.status === 'processed' || o.status === 'completed').length;
        const avgOrderValue = nonCancelledOrders.length ? Math.round(totalSales / nonCancelledOrders.length) : 0;
        const peakOrderVal = nonCancelledOrders.length ? Math.max(...nonCancelledOrders.map(o => o.total)) : 0;

        return (
          <div className="space-y-8 animate-fade-in">
            
            <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
              
              <div className="bg-white/70 p-6 rounded-2xl border border-luxuryGold/20 flex items-center gap-4">
                <div className="w-12 h-12 rounded-full bg-luxuryBeige flex items-center justify-center text-luxuryGold">
                  <Icon name="banknote" className="w-6 h-6" />
                </div>
                <div>
                  <p className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Gross Revenue</p>
                  <p className="text-2xl font-serif font-bold text-darkBrown">{totalSales} MAD</p>
                </div>
              </div>

              <div className="bg-white/70 p-6 rounded-2xl border border-luxuryGold/20 flex items-center gap-4">
                <div className="w-12 h-12 rounded-full bg-luxuryBeige flex items-center justify-center text-luxuryGold">
                  <Icon name="shopping-cart" className="w-6 h-6" />
                </div>
                <div>
                  <p className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">All-time Orders</p>
                  <p className="text-2xl font-serif font-bold text-darkBrown">{nonCancelledOrders.length}</p>
                </div>
              </div>

              <div className="bg-white/70 p-6 rounded-2xl border border-luxuryGold/20 flex items-center gap-4">
                <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-700">
                  <Icon name="clock" className="w-6 h-6" />
                </div>
                <div>
                  <p className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Pending Orders</p>
                  <p className="text-2xl font-serif font-bold text-red-700">{pendingOrdersCount}</p>
                </div>
              </div>

              <div className="bg-white/70 p-6 rounded-2xl border border-luxuryGold/20 flex items-center gap-4">
                <div className="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700">
                  <Icon name="check-circle-2" className="w-6 h-6" />
                </div>
                <div>
                  <p className="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Fulfilled Orders</p>
                  <p className="text-2xl font-serif font-bold text-emerald-700">{processedOrdersCount}</p>
                </div>
              </div>

            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              <div className="lg:col-span-2 bg-[#3D2A1C] text-white p-6 rounded-3xl border border-luxuryGold/30 shadow-2xl space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-white/5 pb-4">
                  <div>
                    <span className="text-[9px] uppercase tracking-widest text-luxuryGold font-extrabold">Live Telemetry</span>
                    <h3 className="font-serif text-xl">Daily Dynamic Revenues</h3>
                  </div>
                  
                  <div className="flex gap-2 flex-wrap">
                    <span className="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-[10px] font-sans text-luxuryBeige flex items-center gap-1">
                      Avg Order: <strong className="font-bold text-luxuryGold">{avgOrderValue} MAD</strong>
                    </span>
                    <span className="bg-white/5 border border-white/10 px-3 py-1 rounded-full text-[10px] font-sans text-luxuryBeige flex items-center gap-1">
                      Peak: <strong className="font-bold text-luxuryGold">{peakOrderVal} MAD</strong>
                    </span>
                  </div>
                </div>

                <div className="h-72 relative w-full">
                  <canvas id="analyticsChart"></canvas>
                </div>
              </div>

              <div className="bg-[#FAF3E7] p-6 rounded-3xl border border-luxuryGold/20 space-y-4 shadow-sm flex flex-col justify-between">
                <div>
                  <h3 className="font-serif text-lg text-coffeeBrown uppercase tracking-wider mb-4 border-b border-luxuryGold/10 pb-2">Top Compositions</h3>
                  <div className="space-y-4">
                    {products.slice(0, 4).map((product, idx) => (
                      <div key={product.id} className="flex items-center gap-3 border-b border-luxuryGold/5 pb-3">
                        <span className="text-xs font-bold text-luxuryGold">#{idx+1}</span>
                        <img src={product.imageURL || fallbackImage} alt={product.name} className="w-10 h-10 object-cover rounded-lg" onError={(e) => { e.target.src = fallbackImage; }} />
                        <div className="flex-1">
                          <p className="text-xs font-semibold text-darkBrown line-clamp-1">{product.name}</p>
                          <p className="text-[10px] text-gray-400">{product.category}</p>
                        </div>
                        <span className="text-xs font-serif font-bold text-coffeeBrown">{product.price} MAD</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="bg-luxuryGold/10 p-4 rounded-2xl border border-luxuryGold/30 text-center text-xs text-coffeeBrown font-medium">
                  Dynamic sorting powered by verified customer checkout volumes.
                </div>
              </div>

            </div>

          </div>
        );

            <div className="overflow-x-auto">

                        <button

                          onClick={() => handleDeleteProduct(product.id)}

                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

      function renderAdminOrders() {

            <div className="overflow-x-auto">

                  <tr>

                      <td className="p-4 text-right">
                        {order.status === 'pending' ? (
                          <div className="flex gap-2 justify-end">

                            <button

                          </div>
                        ) : order.status === 'cancelled' ? (
                          <span className="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Cancelled & Telemetry Subtracted</span>
                        ) : (
                          <div className="flex gap-2 justify-end">
                            <button 
                              type="button"
                              onClick={() => handleUpdateOrderStatus(order.id, 'pending')}

                              Set Pending
                            </button>
                            <button 
                              type="button"
                              onClick={() => handleCancelOrder(order)}
                              className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-[10px] uppercase font-bold tracking-widest rounded-lg transition">

                </tbody>
              </table>
            </div>
          </div>

      function renderAdminReviews() {
        const totalRevCount = reviews.length;
        const avgRating = totalRevCount ? (reviews.reduce((sum, r) => sum + r.rating, 0) / totalRevCount).toFixed(1) : "5.0";
        
        const starsMap = {5: 0, 4: 0, 3: 0, 2: 0, 1: 0};
        reviews.forEach(r => {
          const rating = Math.round(r.rating) || 5;
          if(starsMap[rating] !== undefined) starsMap[rating]++;
        });

        return (
          <div className="space-y-8 animate-fade-in">
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              <div className="bg-[#3D2A1C] text-[#FAF3E7] p-6 rounded-3xl border border-luxuryGold/30 flex flex-col justify-between shadow-lg">
                <span className="text-[10px] uppercase tracking-widest text-luxuryGold font-extrabold">Boutique Health</span>
                <div className="py-4">
                  <p className="text-4xl font-serif font-bold text-white flex items-baseline gap-1.5">
                    {avgRating} <span className="text-xl text-luxuryGold">★</span>
                  </p>
                  <p className="text-xs text-[#F5E6D3]/75 mt-1">Average verified buyer rating across Moroccan regions.</p>
                </div>
                <div className="text-xs text-luxuryGold font-semibold">Total Submissions: {totalRevCount}</div>
              </div>

              <div className="bg-white p-6 rounded-3xl border border-luxuryGold/20 shadow-sm md:col-span-2 space-y-3">
                <h4 className="font-serif text-sm text-coffeeBrown uppercase tracking-wider border-b border-luxuryGold/10 pb-2">Stars Distribution</h4>
                <div className="space-y-2">
                  {[5, 4, 3, 2, 1].map(stars => {
                    const count = starsMap[stars];
                    const percentage = totalRevCount ? Math.round((count / totalRevCount) * 100) : 0;
                    return (
                      <div key={stars} className="flex items-center gap-4 text-xs">
                        <span className="w-12 text-gray-500 font-semibold">{stars} Star</span>
                        <div className="flex-1 bg-gray-100 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-luxuryGold h-full rounded-full transition-all duration-500" style={{ width: `${percentage}%` }}></div>
                        </div>
                        <span className="w-8 text-right text-gray-400 font-light">{count} ({percentage}%)</span>
                      </div>
                    )
                  })}
                </div>
              </div>

            </div>

            <div className="bg-white rounded-3xl p-6 border border-luxuryGold/20 space-y-6">
              <h3 className="font-serif text-xl text-coffeeBrown border-b border-luxuryGold/10 pb-3">Moderate Client Comments ({totalRevCount})</h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {reviews.map(review => {
                  const productObj = products.find(p => p.id === review.productId);
                  return (
                    <div key={review.id} className="p-5 bg-[#FAF3E7] rounded-2xl border border-luxuryGold/20 flex flex-col justify-between gap-4 shadow-xs hover:border-luxuryGold/55 transition">
                      <div>
                        <div className="flex justify-between items-start">
                          <div>
                            <h4 className="font-serif text-md text-coffeeBrown font-semibold">{review.customerName}</h4>
                            <p className="text-[10px] text-gray-400">{review.customerLocation || "Morocco"}</p>
                            {productObj && productObj !== "general" ? (
                              <p className="text-[10px] text-luxuryGold font-medium mt-1">Linked bouquet: {productObj.name}</p>
                            ) : (
                              <p className="text-[10px] text-gray-500 font-medium mt-1">General Boutique Experience</p>
                            )}
                          </div>
                          <span className="text-xs text-amber-500">{"★".repeat(review.rating || 5)}</span>
                        </div>
                        <p className="text-xs text-gray-600 mt-3 font-light leading-relaxed italic">"{review.comment}"</p>
                      </div>

                      <div className="text-right border-t border-luxuryGold/10 pt-3">
                        <button 
                          type="button"
                          onClick={() => {
                            triggerConfirm(
                              "Delete Review",
                              "Remove this client review from your live display forever?",
                              async () => {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reviews', review.id));
                                showToast("Review deleted gracefully.");
                              }
                            );
                          }}
                          className="text-[10px] uppercase font-bold text-red-600 hover:text-red-800 transition tracking-wider flex items-center gap-1 ml-auto">
                          ✕ Delete Feedback
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

                      value={categoryForm.name} 
                      onChange={(e) => setCategoryForm({...categoryForm, name: e.target.value})}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-white focus:outline-none focus:border-luxuryGold"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-semibold text-coffeeBrown uppercase mb-1">Sorting Order</label>
                    <input 
                      type="number" 
                      required 
                      value={categoryForm.order} 
                      onChange={(e) => setCategoryForm({...categoryForm, order: Number(e.target.value)})}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-white focus:outline-none focus:border-luxuryGold"
                    />
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <input 
                    type="checkbox" 
                    id="isActiveCategory"
                    checked={categoryForm.isActive} 
                    onChange={(e) => setCategoryForm({...categoryForm, isActive: e.checked})}
                    className="rounded border-luxuryGold/30 text-luxuryGold focus:ring-luxuryGold"
                  />
                  <label htmlFor="isActiveCategory" className="text-xs text-coffeeBrown cursor-pointer">Active / Visible on Storefront</label>
                </div>
                <div className="flex gap-3 justify-end pt-2">
                  <button 
                    type="button" 
                    onClick={() => setIsAddingCategory(false)}
                    className="px-4 py-2 bg-white text-gray-500 rounded-lg text-xs uppercase font-bold border border-gray-200">
                    Cancel
                  </button>
                  <button 
                    type="submit" 
                    className="px-6 py-2 bg-[#3D2A1C] hover:bg-coffeeBrown text-white rounded-lg text-xs uppercase font-bold transition">
                    Save Category
                  </button>
                </div>
              </form>
            )}

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-darkBrown">
                <thead className="bg-[#FAF3E7] uppercase font-bold tracking-wider border-b border-luxuryGold/25">
                  <tr>
                    <th className="p-4">Category Name</th>
                    <th className="p-4">Sort Order</th>
                    <th className="p-4">Status</th>
                    <th className="p-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {categories.map(cat => (
                    <tr key={cat.id} className="hover:bg-[#FAF3E7]/50 transition">
                      <td className="p-4 font-semibold">{cat.name}</td>
                      <td className="p-4 flex items-center gap-2 font-bold text-luxuryGold">
                        <span>{cat.order || 0}</span>
                        <div className="flex flex-col text-[8px] leading-tight">
                          <button onClick={() => handleReorderCategory(cat, "up")} className="hover:text-darkBrown">▲</button>
                          <button onClick={() => handleReorderCategory(cat, "down")} className="hover:text-darkBrown">▼</button>
                        </div>
                      </td>
                      <td className="p-4">
                        <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                          cat.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                        }`}>
                          {cat.isActive ? 'Visible' : 'Hidden'}
                        </span>
                      </td>
                      <td className="p-4 text-right space-x-2">
                        <button 
                          type="button"
                          onClick={() => { setCategoryForm(cat); setIsAddingCategory(true); }}
                          className="px-3 py-1 bg-luxuryGold hover:bg-darkBrown text-white rounded transition text-[10px] uppercase font-bold tracking-wider">
                          Edit
                        </button>
                        <button 
                          type="button"
                          onClick={() => handleDeleteCategory(cat.id)}
                          className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded transition text-[10px] uppercase font-bold tracking-wider">
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                  {categories.length === 0 && (
                    <tr>
                      <td colSpan="4" className="p-8 text-center text-gray-500 italic">No categories established yet. Dynamic system is loading...</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function renderAdminLookbook() {
        return (
          <div className="bg-white rounded-3xl p-6 border border-luxuryGold/20 space-y-6">
            <div className="flex justify-between items-center">
              <h3 className="font-serif text-xl text-coffeeBrown">Living Lookbook Management</h3>
              <button 
                onClick={() => {
                  setLookbookForm({ id: "", imageURL: "", postURL: "" });
                  setIsEditingLookbook(true);
                }}
                className="px-4 py-2 bg-luxuryGold hover:bg-luxuryGold/90 text-darkBrown text-xs font-bold uppercase tracking-widest rounded-lg transition">
                + Add Lookbook Post
              </button>
            </div>

            {isEditingLookbook && (
              <form onSubmit={handleSaveLookbook} className="bg-[#FAF3E7] p-6 rounded-2xl border border-luxuryGold/30 space-y-4">
                <h4 className="font-serif text-md text-coffeeBrown">{lookbookForm.id ? "Edit Instagram Lookbook Post" : "Add New Instagram Post"}</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[10px] font-semibold text-coffeeBrown uppercase mb-1">Image URL</label>
                    <input 
                      type="url" 
                      required 
                      value={lookbookForm.imageURL} 
                      onChange={(e) => setLookbookForm({...lookbookForm, imageURL: e.target.value})}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-white focus:outline-none focus:border-luxuryGold"
                      placeholder="https://images.unsplash.com/..."
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-semibold text-coffeeBrown uppercase mb-1">Instagram Post Link</label>
                    <input 
                      type="url" 
                      required 
                      value={lookbookForm.postURL} 
                      onChange={(e) => setLookbookForm({...lookbookForm, postURL: e.target.value})}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-luxuryGold/20 bg-white focus:outline-none focus:border-luxuryGold"
                      placeholder="https://www.instagram.com/p/..."
                    />
                  </div>
                </div>
                <div className="flex gap-3 justify-end pt-2">
                  <button 
                    type="button" 
                    onClick={() => setIsEditingLookbook(false)}
                    className="px-4 py-2 bg-white text-gray-500 rounded-lg text-xs uppercase font-bold border border-gray-200">
                    Cancel
                  </button>
                  <button 
                    type="submit" 
                    className="px-6 py-2 bg-[#3D2A1C] hover:bg-coffeeBrown text-white rounded-lg text-xs uppercase font-bold transition">
                    Save Post Card
                  </button>
                </div>
              </form>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              {lookbook.map(item => (
                <div key={item.id} className="bg-[#FAF3E7] p-4 rounded-2xl border border-luxuryGold/25 flex flex-col justify-between space-y-3">
                  <img src={item.imageURL || fallbackImage} alt="Post preview" className="w-full h-40 object-cover rounded-xl border border-luxuryGold/10" onError={(e) => { e.target.src = fallbackImage; }} />
                  <div className="space-y-1">
                    <p className="text-[10px] text-gray-400 uppercase font-semibold">Post Destination:</p>
                    <a href={item.postURL} target="_blank" rel="noopener noreferrer" className="text-xs text-emerald-700 font-semibold truncate block hover:underline">
                      {item.postURL}
                    </a>
                  </div>
                  <div className="flex gap-2 justify-end pt-2 border-t border-luxuryGold/15">
                    <button 
                      type="button"
                      onClick={() => { setLookbookForm(item); setIsEditingLookbook(true); }}
                      className="px-2.5 py-1 bg-luxuryGold text-white rounded text-[10px] uppercase font-bold tracking-wider hover:bg-darkBrown transition">
                      Edit
                    </button>
                    <button 
                      type="button"
                      onClick={() => handleDeleteLookbook(item.id)}
                      className="px-2.5 py-1 bg-red-600 text-white rounded text-[10px] uppercase font-bold tracking-wider hover:bg-red-700 transition">
                      Delete
                    </button>
                  </div>
                </div>
              ))}
              {lookbook.length === 0 && (
                <p className="text-xs text-gray-500 italic col-span-full py-6 text-center">No Instagram posts listed yet. Click "+ Add Lookbook Post" to upload cards.</p>
              )}
            </div>
          </div>
        );
      }

    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
