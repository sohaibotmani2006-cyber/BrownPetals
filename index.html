    body.theme-girls {
      --accent-color: #FF66B2; /* Hot Luxury Rose Pink */
      --accent-glow: rgba(255, 102, 178, 0.15);
      --accent-hover: #E0529C;
    }
    body.theme-boys {
      --accent-color: #1E90FF; /* High-end Cobalt Blue */
      --accent-glow: rgba(30, 144, 255, 0.15);
      --accent-hover: #1573D4;
    }
    body {
      background-color: #0A0A0A;
      color: #E5E5E5;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .luxury-gradient {
      background: linear-gradient(135deg, #0A0A0A 0%, #141414 100%);
    }
    .pink-luxury-gradient {
      background: linear-gradient(135deg, #121212 0%, #181818 50%, #FF66B2 100%);
    }
    .blue-luxury-gradient {
      background: linear-gradient(135deg, #121212 0%, #0A0A0A 50%, #1E90FF 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
    }
    .dark-gradient {
      background: linear-gradient(135deg, #141414 0%, #000000 100%);
    }
    .glassmorphism {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .transition-premium {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0A0A;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 3px;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    @keyframes preloader-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }

    store.addToCart = function(product) {
      const match = this.cart.find(item => item.id === product.id);
      if (match) {
        if (product.stock && match.quantity >= product.stock) {
          showToast(`Only ${product.stock} pieces remaining in exclusive stock.`, "error");
          return;
        }
        match.quantity += 1;
      } else {
        this.cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      showToast(`"${product.name}" added to cart.`);
      this.updateDOM();
    };

    store.updateQty = function(id, delta) {
      const match = this.cart.find(item => item.id === id);
      if (!match) return;
      match.quantity += delta;
      if (match.quantity <= 0) {
        this.cart = this.cart.filter(item => item.id !== id);
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    store.removeFromCart = function(id) {
      this.cart = this.cart.filter(item => item.id !== id);
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    // Chart.js Lazy Loader
    let chartLoaderPromise = null;
    const loadChartLibrary = () => {
      if (chartLoaderPromise) return chartLoaderPromise;
      chartLoaderPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js";
        script.onload = () => resolve(window.Chart);
        script.onerror = () => reject(new Error("Analytics Engine Load Failure"));
        document.head.appendChild(script);
      });
      return chartLoaderPromise;
    };

    store.renderAnalyticsChart = function() {
      const canvas = document.getElementById("analyticsChart");
      if (!canvas) return;

      loadChartLibrary().then((Chart) => {
        const nonCancelled = store.orders.filter(o => o.status !== 'cancelled');
        const dailySales = {};
        const labels = [];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const dayLabel = `${dayNames[d.getDay()]} (${dateString})`;
          labels.push(dayLabel);
          dailySales[dateString] = 0;
        }

        nonCancelled.forEach(order => {
          if (order.createdAt) {
            const orderDate = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
            const dateKey = orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            if (dailySales[dateKey] !== undefined) {
              dailySales[dateKey] += order.total;
            }
          }
        });

        const dataset = Object.keys(dailySales).map(key => dailySales[key]);

        if (window.analyticsChartInstance) {
          window.analyticsChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 240);
        gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
        gradient.addColorStop(1, 'rgba(10, 10, 10, 0.05)');

        window.analyticsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Daily Revenue (MAD)',
              data: dataset,
              borderColor: 'var(--accent-color)',
              borderWidth: 3,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#000000',
              pointBorderColor: 'var(--accent-color)',
              pointRadius: 6,
              pointHoverRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                grid: { color: 'rgba(212, 175, 55, 0.08)' },
                min: 0,
                beginAtZero: true
              },
              x: { grid: { display: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    };

    store.processCheckout = async function(e) {
      e.preventDefault();
      
      if (this.cart.length === 0) return;
      
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;

      if (!name || !phone || !cityId || !address) {
        showToast("Please fill in all required delivery coordinates.", "error");
        return;
      }

      this.checkoutLoading = true;
      this.updateDOM();

      try {
        const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);
        const cityObj = this.deliveryCities.find(c => c.id === cityId);
        const deliveryFee = cityObj ? cityObj.price : 0;
        const cityName = cityObj ? cityObj.name : "Morocco";
        const total = subtotal + deliveryFee;
        const orderId = "SOV-" + Math.floor(100000 + Math.random() * 900000);

        const orderItems = this.cart.map(item => ({
          id: item.id,
          name: item.name,
          quantity: item.quantity,
          price: item.discountPrice || item.price
        }));

        const newOrder = {
          orderId,
          items: orderItems,
          total,
          subtotal,
          deliveryFee,
          deliveryCity: cityName,
          customerName: name,
          phone,
          address,
          status: "pending",
          paymentMethod: "Telegram Automated",
          createdAt: new Date()
        };

        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        await addDoc(ordersCol, newOrder);

        let productsMsg = "";
        this.cart.forEach(item => {
          productsMsg += `• *${item.name}* x${item.quantity} (${item.discountPrice || item.price} MAD)\n`;
        });

        let msgText = this.telegramSettings.template
          .replace(/{products}/g, productsMsg.trim())
          .replace(/{subtotal}/g, subtotal)
          .replace(/{city}/g, cityName)
          .replace(/{delivery}/g, deliveryFee)
          .replace(/{total}/g, total)
          .replace(/{name}/g, name)
          .replace(/{address}/g, address)
          .replace(/{phone}/g, phone)
          .replace(/{orderId}/g, orderId);

        if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
          try {
            const telegramUrl = `https://api.telegram.org/bot${this.telegramSettings.botToken}/sendMessage`;
            await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: this.telegramSettings.chatId,
                text: msgText,
                parse_mode: "Markdown"
              })
            });
          } catch (apiErr) {
            console.error("Direct Telegram bot execution failed.", apiErr);
          }
        }

        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "" };
        this.cartOpen = false;
        this.checkoutLoading = false;
        
        // Show Order Confirmation modal
        triggerConfirm(
          "Selection Confirmed", 
          `<div class="space-y-4">` +
            `<p class="text-xs text-gray-300">Your order has been registered successfully!</p>` +
            `<div class="bg-black/50 p-4 rounded-xl border border-luxuryGold/20">` +
              `<p class="text-[10px] uppercase tracking-wider text-luxuryGold font-semibold mb-1">Order Code (ID)</p>` +
              `<span class="inline-block bg-black/80 text-luxuryGold font-mono text-base font-bold px-4 py-2 rounded-lg border border-luxuryGold/40 tracking-wider select-all cursor-pointer hover:border-luxuryGold transition" title="Double click to select and copy">${orderId}</span>` +
            `</div>` +
            `<p class="text-[11px] text-gray-400">Please copy this ID and send it to our customer support on WhatsApp to complete and track your delivery.</p>` +
          `</div>`, 
          () => {
            store.setPage("home");
          },
          true
        );

      } catch (err) {
        console.error(err);
        this.checkoutLoading = false;
        showToast("Order checkout pipeline failed. Please try again.", "error");
        showFirebaseDiagnosticModal(
          "Checkout Connection Blocked", 
          `Unable to register order in Firestore. Firebase error details: ${err.message}`
        );
        this.updateDOM();
      }
    };

    store.createProductCardMarkup = function(product) {
      const normalizedGender = getNormalizedGender(product.gender);
      const isGirls = normalizedGender === "GIRLS STORE";
      const genderThemeBorder = 'border-luxuryGold/30 hover:border-luxuryGold';
      const badgeColor = isGirls ? 'bg-luxuryGold/10 text-luxuryGold' : 'bg-white/10 text-white';
      const btnOutlineColor = 'border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-black';
      const btnSolidColor = 'bg-luxuryGold hover:bg-luxuryGold/90 text-black';

      return `
        <div class="group relative bg-[#141414] rounded-2xl overflow-hidden border ${genderThemeBorder} shadow-md hover:shadow-2xl transition-all duration-300 flex flex-col justify-between">
          <div>
            <div class="h-44 sm:h-64 md:h-80 overflow-hidden relative cursor-pointer card-img-trigger" data-id="${product.id}">
              <img src="${product.imageURL || fallbackImage}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" loading="lazy" decoding="async">
              <div class="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition"></div>
              
              <div class="absolute top-2 left-2 sm:top-4 sm:left-4 flex flex-col gap-1">
                ${product.isPromotion ? `<span class="bg-red-700 text-white text-[7px] sm:text-[9px] uppercase font-bold tracking-widest px-1.5 py-0.5 sm:px-3 sm:py-1 rounded-full shadow-lg">Sale</span>` : ''}
                ${product.isBestSeller ? `<span class="bg-[#000000] border border-luxuryGold/45 text-luxuryGold text-[7px] sm:text-[9px] uppercase font-bold tracking-widest px-1.5 py-0.5 sm:px-3 sm:py-1 rounded-full shadow-lg">Best</span>` : ''}
              </div>
              <div class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4">
                <span class="${badgeColor} text-[7px] sm:text-[10px] uppercase font-bold px-1.5 py-0.5 sm:px-3 sm:py-1.5 rounded-full shadow border border-luxuryGold/20">${normalizedGender}</span>
              </div>
            </div>

            <div class="p-3 sm:p-6 space-y-1.5 sm:space-y-4">
              <span class="text-[8px] sm:text-[10px] uppercase tracking-widest text-luxuryGold font-semibold">${product.category}</span>
              <h3 class="font-serif text-sm sm:text-lg text-white group-hover:text-luxuryGold transition cursor-pointer card-title-trigger h-10 sm:h-14 overflow-hidden" data-id="${product.id}">${product.name}</h3>
              
              <div class="flex items-center gap-1 text-[10px] sm:text-xs">
                <span class="text-amber-500">${"★".repeat(Math.round(product.rating || 5))}</span>
                <span class="text-gray-400 font-light">(${product.reviewsCount || 12})</span>
              </div>
            </div>
          </div>

          <div class="p-3 sm:p-6 pt-0 space-y-2 sm:space-y-3">
            <div class="flex items-baseline gap-1.5 sm:gap-2">
              ${product.discountPrice ? `
                <span class="text-sm sm:text-lg font-bold text-luxuryGold">${product.discountPrice} MAD</span>
                <span class="text-[9px] sm:text-xs line-through text-gray-500">${product.price} MAD</span>
              ` : `<span class="text-sm sm:text-lg font-bold text-white">${product.price} MAD</span>`}
            </div>

            <div class="grid grid-cols-2 gap-1.5 sm:gap-2">
              <button class="add-to-cart-btn px-1 py-1.5 sm:px-2 sm:py-2 border ${btnOutlineColor} text-[8px] sm:text-[10px] uppercase font-bold tracking-wider rounded-lg transition duration-200" data-id="${product.id}">Add</button>
              <button class="order-now-btn px-1 py-1.5 sm:px-2 sm:py-2 ${btnSolidColor} text-[8px] sm:text-[10px] uppercase font-bold tracking-wider rounded-lg transition duration-200 shadow-sm" data-id="${product.id}">Buy</button>
            </div>
          </div>
        </div>
      `;
    };

    store.bindProductCardClicks = function() {
      document.querySelectorAll(".card-img-trigger, .card-title-trigger").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod);
        };
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.addToCart(prod);
        };
      });

      document.querySelectorAll(".order-now-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) {
            store.cart = [{ ...prod, quantity: 1 }];
            localStorage.setItem("bp_cart", JSON.stringify(store.cart));
            store.cartOpen = true;
            document.getElementById("cart-drawer-overlay").classList.remove("hidden");
            store.renderCartDrawer();
          }
        };
      });
    };

    store.renderShopPage = function() {
      const container = document.getElementById("app-content");
      if (!container) return;
      
      const filtered = this.products.filter(p => {
        const normalizedGender = getNormalizedGender(p.gender);
        const matchesGender = this.selectedGenderSection === "All" || normalizedGender === this.selectedGenderSection;
        const matchesCategory = this.selectedCategory === "All" || p.category === this.selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(this.searchQuery.toLowerCase());
        return matchesGender && matchesCategory && matchesSearch;
      });

      let productsGrid = "";
      if (this.loadingProducts && filtered.length === 0) {
        productsGrid = Array(6).fill(this.createSkeletonCardMarkup()).join('');
      } else {
        productsGrid = filtered.map(p => this.createProductCardMarkup(p)).join('');
      }

      const genderSelectorTabs = `
        <div class="grid grid-cols-3 gap-2 p-1.5 bg-[#141414] rounded-2xl border border-luxuryGold/20">

          }" data-gender="GIRLS STORE">GIRLS</button>
          
          <button class="gender-section-btn py-2.5 px-3 sm:py-3 sm:px-4 text-[10px] sm:text-xs font-bold uppercase rounded-xl tracking-wider transition ${
            this.selectedGenderSection === "MAN STORE" ? 'bg-luxuryGold text-black shadow-md' : 'text-luxuryGold hover:bg-white/5'

        </div>

      let categoryButtons = `

        }" data-name="All">All Categories</button>
      `;

      categoryButtons += this.categories.filter(c => c.isActive).map(c => `
        <button class="category-filter-btn text-left px-4 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-premium ${
          this.selectedCategory === c.name ? 'bg-luxuryGold text-black shadow-sm' : 'text-white hover:bg-white/5'
        }" data-name="${c.name}">${c.name}</button>
      `).join('');

      container.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
          
          <!-- STICKY FLOATING BACK-TO-HOME CAPSULE (No full block/background) -->

            <button id="shop-back-home" class="pointer-events-auto flex items-center gap-2 text-[10px] sm:text-xs uppercase tracking-widest text-luxuryGold hover:text-white bg-black/90 backdrop-blur-md border border-luxuryGold/30 px-4 py-2.5 rounded-full shadow-lg transition-premium font-bold">
              ← Back to Home
            </button>
          </div>

          <div class="text-center space-y-3 pt-8">
            <span class="text-xs uppercase tracking-widest text-luxuryGold font-semibold">SOVANEX Catalog</span>
            <h1 class="text-4xl font-serif text-white">The Boutique</h1>
            <div class="w-12 h-0.5 bg-luxuryGold mx-auto mt-2"></div>
          </div>

          <!-- Dynamic Collection Filtering Tabs -->
          <div class="max-w-xl mx-auto space-y-4">
            ${genderSelectorTabs}
            
            <!-- Dynamic In-Shop Real-Time Search Bar -->
            <div class="relative w-full">
              <input id="shop-search-input" type="text" placeholder="Search boutique creations..." value="${this.searchQuery}" class="w-full pl-10 pr-4 py-3 text-xs rounded-xl border border-luxuryGold/30 bg-white/5 focus:outline-none focus:border-luxuryGold text-white transition-premium">
              <div class="absolute left-3.5 top-3.5 text-luxuryGold">${getIconSvg('search', 'w-4 h-4')}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

      } else if (this.adminView === "reviews") {
        this.renderAdminReviews(container);

        this.renderAdminDelivery(container);
      } else if (this.adminView === "categories") {
        this.renderAdminCategories(container);
      } else if (this.adminView === "lookbook") {
        this.renderAdminLookbook(container);
      } else if (this.adminView === "telegram-settings") {
        this.renderAdminTelegramSettings(container);

    store.renderCartDrawer = function() {
      const container = document.getElementById("cart-drawer-overlay");
      if (!container) return;
      if (!this.cartOpen) {
        container.classList.add("hidden");
        return;
      }

      const existingName = document.querySelector("input[name='customerName']")?.value;
      const existingPhone = document.querySelector("input[name='phone']")?.value;
      const existingAddress = document.querySelector("textarea[name='address']")?.value;
      const existingCityId = document.getElementById("checkout-city-select")?.value;

      if (existingName !== undefined) this.checkoutFormValues.customerName = existingName;
      if (existingPhone !== undefined) this.checkoutFormValues.phone = existingPhone;
      if (existingAddress !== undefined) this.checkoutFormValues.address = existingAddress;
      if (existingCityId !== undefined) this.checkoutFormValues.cityId = existingCityId;

      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      const selectedCityId = this.checkoutFormValues.cityId;
      const cityObj = this.deliveryCities.find(c => c.id === selectedCityId);
      const deliveryFee = cityObj ? cityObj.price : 0;
      const total = subtotal + deliveryFee;

      let itemsMarkup = this.cart.map(item => `
        <div class="flex gap-4 p-3 bg-black/60 rounded-xl border border-luxuryGold/10 hover:border-luxuryGold/35 transition">
          <img src="${item.imageURL || fallbackImage}" class="w-20 h-20 object-cover rounded-lg border border-luxuryGold/20" loading="lazy">
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-serif text-sm text-white font-medium line-clamp-1">${item.name}</h4>
              <p class="text-xs text-luxuryGold font-semibold mt-0.5">${item.discountPrice || item.price} MAD</p>
            </div>
            <div class="flex justify-between items-center mt-2">
              <div class="flex items-center border border-luxuryGold/30 rounded-lg overflow-hidden bg-black">
                <button class="cart-qty-minus px-2.5 py-1 hover:bg-white/5 text-xs font-bold" data-id="${item.id}">-</button>
                <span class="px-3 text-xs font-semibold text-white">${item.quantity}</span>
                <button class="cart-qty-plus px-2.5 py-1 hover:bg-white/5 text-xs font-bold" data-id="${item.id}">+</button>
              </div>
              <button class="cart-remove-item text-xs text-red-400 hover:text-red-600 transition" data-id="${item.id}">Remove</button>
            </div>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="absolute inset-0 bg-black/80 backdrop-blur-xs transition-opacity" id="cart-drawer-backdrop"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
          <div class="w-screen max-w-md bg-black border-l border-luxuryGold/30 flex flex-col shadow-2xl text-white">
            <div class="p-6 border-b border-luxuryGold/20 flex justify-between items-center bg-[#141414]">
              <h2 class="text-xl font-serif text-luxuryGold flex items-center gap-2">
                ${getIconSvg('shopping-bag', 'text-luxuryGold w-6 h-6')} Your Selection
              </h2>
              <button id="cart-drawer-close" class="p-2 hover:text-luxuryGold transition rounded-full hover:bg-white/5">✕</button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-4">
              ${cartCount === 0 ? `
                <div class="text-center py-12 space-y-4">
                  <div class="text-luxuryGold/30 animate-spin" style="animation-duration: 8s">${getIconSvg('flower', 'w-16 h-16 mx-auto')}</div>
                  <p class="font-serif text-lg text-luxuryGold">Your cart is empty</p>
                  <button id="cart-drawer-shop-btn" class="mt-4 px-6 py-2 bg-luxuryGold text-black text-xs font-bold uppercase rounded-lg">Boutique</button>
                </div>
              ` : itemsMarkup}
            </div>

            ${cartCount > 0 ? `
              <div class="p-6 border-t border-luxuryGold/30 bg-[#141414] space-y-4">
                <div class="flex justify-between items-center text-sm font-medium">
                  <span class="text-gray-300">Subtotal</span>
                  <span class="text-xl font-serif font-bold text-luxuryGold">${subtotal} MAD</span>
                </div>

                ${selectedCityId ? `
                  <div class="flex justify-between items-center text-sm font-medium border-t border-white/5 pt-2">
                    <span class="text-gray-300">Delivery Fee</span>
                    <span class="font-serif font-bold text-luxuryGold">${deliveryFee} MAD</span>
                  </div>
                  <div class="flex justify-between items-center text-sm font-bold border-t border-white/10 pt-2">
                    <span class="text-gray-300">Total</span>
                    <span class="text-xl font-serif font-bold text-luxuryGold">${total} MAD</span>
                  </div>
                ` : ''}

                <div class="bg-black/40 p-4 rounded-xl border border-luxuryGold/20">
                  <p class="text-xs font-semibold text-luxuryGold mb-3 uppercase">Shipping Information</p>
                  <form id="checkout-form" class="space-y-3">
                    <input type="text" name="customerName" required placeholder="Full Name" value="${this.checkoutFormValues.customerName}" class="w-full px-3 py-2 text-xs rounded-lg border border-luxuryGold/30 focus:outline-none focus:border-luxuryGold bg-[#111] text-white">
                    <input type="tel" name="phone" required placeholder="Phone Number (e.g. 06...)" value="${this.checkoutFormValues.phone}" class="w-full px-3 py-2 text-xs rounded-lg border border-luxuryGold/30 focus:outline-none focus:border-luxuryGold bg-[#111] text-white">
                    
                    <select id="checkout-city-select" name="cityId" required class="w-full px-3 py-2 text-xs rounded-lg border border-luxuryGold/30 focus:outline-none focus:border-luxuryGold bg-[#111] text-white">
                      <option value="" disabled ${!selectedCityId ? 'selected' : ''}>Select Delivery City</option>
                      ${this.deliveryCities.filter(c => c.isActive).map(c => `
                        <option value="${c.id}" ${selectedCityId === c.id ? 'selected' : ''}>${c.name} (+${c.price} MAD)</option>
                      `).join('')}
                    </select>

                    <textarea name="address" required placeholder="Delivery Address" class="w-full px-3 py-2 text-xs rounded-lg border border-luxuryGold/30 focus:outline-none focus:border-luxuryGold bg-[#111] text-white h-14 resize-none">${this.checkoutFormValues.address}</textarea>
                    
                    <button type="submit" id="checkout-submit-button" ${this.checkoutLoading ? 'disabled' : ''} class="w-full py-3 bg-luxuryGold text-black hover:bg-luxuryGold/90 font-bold uppercase tracking-widest text-xs rounded-xl flex items-center justify-center gap-2">
                      ${this.checkoutLoading ? "Processing Request..." : "Confirm Luxury Order"}
                      ${getIconSvg('send', 'w-3.5 h-3.5')}
                    </button>
                  </form>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      document.getElementById("cart-drawer-backdrop").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      document.getElementById("cart-drawer-close").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      
      const shopBtn = document.getElementById("cart-drawer-shop-btn");
      if (shopBtn) {
        shopBtn.onclick = () => { store.cartOpen = false; store.setPage("shop"); };
      }

      document.querySelectorAll(".cart-qty-minus").forEach(btn => {
        btn.onclick = () => store.updateQty(btn.getAttribute("data-id"), -1);
      });

      document.querySelectorAll(".cart-qty-plus").forEach(btn => {
        btn.onclick = () => store.updateQty(btn.getAttribute("data-id"), 1);
      });

      document.querySelectorAll(".cart-remove-item").forEach(btn => {
        btn.onclick = () => store.removeFromCart(btn.getAttribute("data-id"));
      });

      const citySelect = document.getElementById("checkout-city-select");
      if (citySelect) {
        citySelect.onchange = () => store.renderCartDrawer();
      }

      const checkoutForm = document.getElementById("checkout-form");
      if (checkoutForm) {
        checkoutForm.onsubmit = (e) => store.processCheckout(e);
      }
    };

      }
    };

    const hidePreloader = () => {
      const preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        preloader.style.visibility = 'hidden';
        setTimeout(() => preloader.remove(), 400);
      }
    };

    const preloaderTimeout = setTimeout(hidePreloader, 1200);

    async function initAppSequence() {
      try {
        let user = auth.currentUser;
        if (!user) {
          const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (customToken) {
            try {
              const credential = await signInWithCustomToken(auth, customToken);
              user = credential.user;
            } catch (tokenError) {
              console.warn("Firebase Auth: Custom token mismatch. Bypassing to Anonymous Authentication.", tokenError);
              const credential = await signInAnonymously(auth);
              user = credential.user;
            }
          } else {
            const credential = await signInAnonymously(auth);
            user = credential.user;
          }
        }
        
        if (user) {
          store.user = user;
          store.initPublicSubscriptions();
          if (store.isAdmin) {
            store.initAdminSubscriptions();
          }
        }
      } catch (error) {
        console.error("Firebase Auth Failure:", error);
        
        if (error.code === 'auth/operation-not-allowed') {
          showFirebaseDiagnosticModal(
            "Anonymous Auth Disabled",
            "SOVANEX cannot identify connection credentials because 'Anonymous Sign-In' is disabled inside your Firebase Console."
          );
        } else {
          showFirebaseDiagnosticModal(
            "Firebase Initialization Alert",
            `Authentication returned: "${error.message}". Ensure your Firestore Rules allow connection access.`
          );
        }

        // Bypassing Auth guard for direct read
        store.initPublicSubscriptions(true); 
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      store.updateDOM();

      initAppSequence().then(() => {
        clearTimeout(preloaderTimeout);
        hidePreloader();
      });

      onAuthStateChanged(auth, (usr) => {
        if (usr) {
          store.user = usr;

          // Admin Privileges Guard Pre-Check
          if (usr.email === "bilalotami@gmail.com") {
            store.isAdmin = true;
          } else {
            store.isAdmin = false;
            if (usr.email && usr.email !== "bilalotami@gmail.com") {
              signOut(auth).then(() => {
                showToast("Unauthorized account. Signed out.", "error");
                signInAnonymously(auth).catch(console.error);
                if (store.currentPage === "admin") store.setPage("home");
              });
              return;
            }
          }

          store.initPublicSubscriptions();
          
          if (store.isAdmin) {
            store.initAdminSubscriptions();
            if (store.currentPage === "admin") {
              store.renderAdminPage();
            }
          }
        } else {
           signInAnonymously(auth).catch(console.error);
        }
      });
    });
  </script>
</body>
</html>
