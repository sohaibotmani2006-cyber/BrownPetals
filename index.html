<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brown Petals — Luxury Flower Shop Morocco</title>
  
  <!-- DNS Preconnect to reduce load latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <!-- Font Families -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
  
  <!-- Precompiled Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            luxuryBeige: '#F5E6D3',
            softBeige: '#FAF3E7',
            coffeeBrown: '#6F4E37',
            luxuryGold: '#C8A96A',
            darkBrown: '#3D2A1C',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Import Map for Native Firebase imports in Vanilla JS -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF3E7;
      color: #3D2A1C;
    }
    .luxury-gradient {
      background: linear-gradient(135deg, #FAF3E7 0%, #F5E6D3 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #C8A96A 0%, #A8894A 100%);
    }
    .dark-gradient {
      background: linear-gradient(135deg, #3D2A1C 0%, #6F4E37 100%);
    }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(200, 169, 106, 0.2);
    }
    .transition-premium {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF3E7;
    }
    ::-webkit-scrollbar-thumb {
      background: #C8A96A;
      border-radius: 3px;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    @keyframes preloader-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="font-sans antialiased overflow-x-hidden">

  <!-- INSTANT LUXURY PRELOADER -->
  <div id="app-preloader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #FAF3E7; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease-out, visibility 0.4s ease-out; font-family: 'Playfair Display', serif;">
    <div style="font-size: 28px; letter-spacing: 0.3em; color: #3D2A1C; margin-bottom: 24px; font-weight: 400; text-align: center;">
      BROWN <span style="color: #C8A96A; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 300; letter-spacing: 0.1em; display: inline-block; margin-left: 4px;">PETALS</span>
    </div>
    <div style="width: 32px; height: 32px; border: 1.5px solid rgba(200, 169, 106, 0.15); border-top: 1.5px solid #C8A96A; border-radius: 50%; animation: preloader-spin 0.9s linear infinite;"></div>
    <div style="margin-top: 20px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; color: #6F4E37; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 400;">
      Atelier Compositions Loading...
    </div>
  </div>

  <!-- Main Application Wrapper -->
  <div id="app-wrapper" class="min-h-screen flex flex-col justify-between text-darkBrown selection:bg-luxuryGold selection:text-white">
    
    <!-- Application Header Mount -->
    <div id="app-header"></div>

    <!-- Application Main View Mount -->
    <main id="app-content" class="flex-grow"></main>

    <!-- Application Footer Mount -->
    <footer id="app-footer" class="bg-darkBrown text-[#FAF3E7] pt-16 pb-8 border-t border-luxuryGold/30"></footer>

  </div>

  <!-- Floating Elements Mount Container -->
  <div id="app-drawers-and-overlays">
    <!-- Cart Drawer Container -->
    <div id="cart-drawer-overlay" class="hidden fixed inset-0 z-50 overflow-hidden"></div>
    
    <!-- Lightbox Modal Container -->
    <div id="lightbox-container" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md"></div>
    
    <!-- Product Detail Modal Container -->
    <div id="product-detail-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"></div>
    
    <!-- Custom Confirmation Modal Container -->
    <div id="confirm-modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"></div>

    <!-- Floating Global Actions -->
    <div id="floating-actions"></div>

    <!-- Toast Notifications Center -->
    <div id="toast-center"></div>
  </div>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, doc, setDoc, addDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, serverTimestamp, increment } from "firebase/firestore";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";

    // Production Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB6hjHQ8qpp4yymMTtp1wYlQaV1dWlVeBs",
      authDomain: "brown-petals.firebaseapp.com",
      projectId: "brown-petals",
      storageBucket: "brown-petals.firebasestorage.app",
      messagingSenderId: "620510912091",
      appId: "1:620510912091:web:49e1d751b624e6401ee97e",
      measurementId: "G-08EQ2F0LLX"
    };

    // Instantiate Services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = "brown-petals";
    const fallbackImage = "https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&q=80&w=800";
    const WHATSAPP_LINK = "https://wa.me/212777467304";

    // Unified Reactive Application Store
    const store = {
      user: null,
      isAdmin: false,
      adminView: "dashboard", // dashboard, products, orders, reviews, delivery, categories
      currentPage: "home", // home, shop, contact, admin
      cartOpen: false,
      searchQuery: "",
      selectedCategory: "All",
      products: [],
      orders: [],
      reviews: [],
      categories: [],
      lookbook: [],
      deliveryCities: [],
      cart: JSON.parse(localStorage.getItem("bp_cart")) || [],
      loadingProducts: true,
      loadingCategories: true,
      checkoutLoading: false,
      
      // Temporary state to preserve inputs during cart re-renders
      checkoutFormValues: {
        customerName: "",
        phone: "",
        cityId: "",
        address: ""
      },
      
      // Telegram Bot Settings Cache
      telegramSettings: {
        botToken: "",
        chatId: "",
        botEnabled: true,
        template: "🌸 *New Order Received!* 🌸\n\n*Order ID:* {orderId}\n*Customer Name:* {name}\n*Phone:* {phone}\n*City:* {city}\n*Address:* {address}\n\n*Items Purchased:*\n{products}\n\n*Subtotal:* {subtotal} MAD\n*Delivery Fee:* {delivery} MAD\n*Total Amount:* {total} MAD\n\n_Thank you!_"
      },

      // Navigation Actions
      setPage(page) {
        this.currentPage = page;
        if (page === "admin" && this.isAdmin) {
          this.initAdminSubscriptions();
        }
        window.scrollTo({ top: 0, behavior: 'instant' });
        this.updateDOM();
      },

      activeSubscriptions: {
        public: false,
        admin: false
      }
    };

    // SVG Icon Directory Helper
    const getIconSvg = (name, customClass = "w-5 h-5") => {
      const paths = {
        search: `<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        "shopping-bag": `<g><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M16 10a4 4 0 01-8 0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        menu: `<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        instagram: `<g><rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        facebook: `<path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        phone: `<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        "message-circle": `<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        x: `<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        send: `<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        star: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        gem: `<g><path d="M6 3h12l4 6-10 13L2 9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M11 3L8 9l4 13 4-13-3-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M2 9h20" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        truck: `<g><rect x="1" y="3" width="15" height="13" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><circle cx="5.5" cy="18.5" r="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><circle cx="18.5" cy="18.5" r="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        gift: `<g><rect x="3" y="8" width="18" height="14" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M12 5V22M3 12h18M12 5a3 3 0 10-3-3M12 5a3 3 0 113-3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        "arrow-down": `<path d="M12 5v14M19 12l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />`,
        "shield-check": `<g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M9 11l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        lock: `<g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M7 11V7a5 5 0 0110 0v4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        banknote: `<g><rect x="2" y="6" width="20" height="12" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><circle cx="12" cy="12" r="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M6 12h.01M18 12h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        "shopping-cart": `<g><circle cx="9" cy="21" r="1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><circle cx="20" cy="21" r="1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        clock: `<g><circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><polyline points="12 6 12 12 16 14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,
        flower: `<g><circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M12 5a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M12 11a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M5 12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M11 12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3 3 3 0 0 0-3 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`
      };
      return `<svg class="${customClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${paths[name] || ''}</svg>`;
    };

    store.createSkeletonCardMarkup = function() {
      return `
        <div class="animate-pulse bg-white rounded-3xl overflow-hidden border border-luxuryGold/10 shadow-md p-6 space-y-4">
          <div class="h-80 bg-[#F5E6D3]/30 rounded-2xl"></div>
          <div class="space-y-2">
            <div class="h-3 bg-luxuryGold/20 rounded w-1/4 animate-pulse"></div>
            <div class="h-5 bg-coffeeBrown/15 rounded w-3/4 animate-pulse"></div>
            <div class="h-3 bg-gray-200/50 rounded w-1/2 animate-pulse"></div>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <div class="h-8 bg-luxuryBeige/40 rounded-lg animate-pulse"></div>
            <div class="h-8 bg-coffeeBrown/10 rounded-lg animate-pulse"></div>
          </div>
        </div>
      `;
    };

    // Feedback and Utility Systems
    const showToast = (message, type = "success") => {
      const container = document.getElementById("toast-center");
      const id = "toast-" + Date.now();
      const markup = `
        <div id="${id}" class="fixed top-6 right-6 z-50 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl transition-premium border ${
          type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-[#FAF3E7] border-luxuryGold text-darkBrown'
        }">
          <div class="w-2.5 h-2.5 rounded-full bg-luxuryGold animate-ping"></div>
          <span class="font-medium text-sm tracking-wide">${message}</span>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', markup);
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.remove();
      }, 3500);
    };

    // Custom Interactive Confirmation Dialog (Replaces confirm() safely)
    const triggerConfirm = (title, message, onConfirmCallback) => {
      const modal = document.getElementById("confirm-modal-container");
      modal.innerHTML = `
        <div class="absolute inset-0 bg-black/60 backdrop-blur-xs"></div>
        <div class="relative bg-[#FAF3E7] p-6 rounded-2xl max-w-sm w-full border border-luxuryGold/30 shadow-2xl z-10 text-center space-y-4">
          <h3 class="font-serif text-lg text-coffeeBrown font-bold">${title}</h3>
          <p class="text-xs text-gray-500 font-light leading-relaxed">${message}</p>
          <div class="flex gap-3 justify-center pt-2">
            <button id="confirm-cancel-btn" class="px-4 py-2 bg-white text-gray-500 rounded-lg text-xs uppercase font-bold tracking-wider border border-gray-200 hover:bg-gray-50 transition">Cancel</button>
            <button id="confirm-submit-btn" class="px-4 py-2 bg-red-600 text-white rounded-lg text-xs uppercase font-bold tracking-wider hover:bg-red-700 transition shadow-md">Confirm</button>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      
      document.getElementById("confirm-cancel-btn").onclick = () => modal.classList.add("hidden");
      document.getElementById("confirm-submit-btn").onclick = () => {
        onConfirmCallback();
        modal.classList.add("hidden");
      };
    };

    store.initPublicSubscriptions = function() {
      if (this.activeSubscriptions.public) return;
      this.activeSubscriptions.public = true;

      // Products Feed
      const prodQuery = collection(db, 'artifacts', appId, 'public', 'data', 'products');
      onSnapshot(prodQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        store.products = list;
        store.loadingProducts = false;
        store.updateDOM();
      });

      // Categories Config
      const catQuery = collection(db, 'artifacts', appId, 'public', 'data', 'categories');
      onSnapshot(catQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        
        // Seed initial categories if none exist in the database yet
        if (list.length === 0) {
          const defaults = ["Mother's Day", "Flowers box", "Special flowers", "Medium bouquet", "Flowers bouquet"];
          defaults.forEach(async (name, index) => {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'categories'), {
              name,
              order: index,
              isActive: true,
              createdAt: new Date()
            });
          });
        }
        
        store.categories = list.sort((a,b) => (a.order || 0) - (b.order || 0));
        store.loadingCategories = false;
        store.updateDOM();
      });

      // Lookbook Grid
      const lookbookQuery = collection(db, 'artifacts', appId, 'public', 'data', 'lookbook');
      onSnapshot(lookbookQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        store.lookbook = list;
        store.updateDOM();
      });

      // Load Delivery Cities
      const citiesQuery = collection(db, 'artifacts', appId, 'public', 'data', 'deliveryCities');
      onSnapshot(citiesQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        store.deliveryCities = list.sort((a,b) => a.name.localeCompare(b.name));
        store.updateDOM();
      });

      // Telegram configuration settings
      const botConfigDoc = doc(db, 'artifacts', appId, 'public', 'data', 'telegramSettings', 'live');
      onSnapshot(botConfigDoc, (snap) => {
        if (snap.exists()) {
          store.telegramSettings = { ...store.telegramSettings, ...snap.data() };
        }
      });
    };

    store.initAdminSubscriptions = function() {
      if (this.activeSubscriptions.admin) return;
      this.activeSubscriptions.admin = true;

      // Realtime Orders
      const orderQuery = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
      onSnapshot(orderQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        store.orders = list.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        store.updateDOM();
        if (store.currentPage === "admin" && store.adminView === "dashboard") {
          store.renderAnalyticsChart();
        }
      });

      // Realtime Reviews
      const revQuery = collection(db, 'artifacts', appId, 'public', 'data', 'reviews');
      onSnapshot(revQuery, (snap) => {
        const list = [];
        snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        store.reviews = list.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        store.updateDOM();
      });
    };

    store.addToCart = function(product) {
      const match = this.cart.find(item => item.id === product.id);
      if (match) {
        if (product.stock && match.quantity >= product.stock) {
          showToast(`Only ${product.stock} pieces remaining in exclusive stock.`, "error");
          return;
        }
        match.quantity += 1;
      } else {
        this.cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      showToast(`"${product.name}" selected.`);
      this.updateDOM();
    };

    store.updateQty = function(id, delta) {
      const match = this.cart.find(item => item.id === id);
      if (!match) return;
      match.quantity += delta;
      if (match.quantity <= 0) {
        this.cart = this.cart.filter(item => item.id !== id);
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    store.removeFromCart = function(id) {
      this.cart = this.cart.filter(item => item.id !== id);
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    // Chart.js Lazy Loader
    let chartLoaderPromise = null;
    const loadChartLibrary = () => {
      if (chartLoaderPromise) return chartLoaderPromise;
      chartLoaderPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js";
        script.onload = () => resolve(window.Chart);
        script.onerror = () => reject(new Error("Analytics Engine Load Failure"));
        document.head.appendChild(script);
      });
      return chartLoaderPromise;
    };

    // Dynamic Chart rendering
    store.renderAnalyticsChart = function() {
      const canvas = document.getElementById("analyticsChart");
      if (!canvas) return;

      loadChartLibrary().then((Chart) => {
        const nonCancelled = store.orders.filter(o => o.status !== 'cancelled');
        const dailySales = {};
        const labels = [];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const dayLabel = `${dayNames[d.getDay()]} (${dateString})`;
          labels.push(dayLabel);
          dailySales[dateString] = 0;
        }

        nonCancelled.forEach(order => {
          if (order.createdAt) {
            const orderDate = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
            const dateKey = orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            if (dailySales[dateKey] !== undefined) {
              dailySales[dateKey] += order.total;
            }
          }
        });

        const dataset = Object.keys(dailySales).map(key => dailySales[key]);

        if (window.analyticsChartInstance) {
          window.analyticsChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 240);
        gradient.addColorStop(0, 'rgba(200, 169, 106, 0.45)');
        gradient.addColorStop(1, 'rgba(250, 243, 231, 0.05)');

        window.analyticsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Daily Revenue (MAD)',
              data: dataset,
              borderColor: '#C8A96A',
              borderWidth: 3,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#3D2A1C',
              pointBorderColor: '#C8A96A',
              pointRadius: 6,
              pointHoverRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                grid: { color: 'rgba(200, 169, 106, 0.08)' },
                min: 0,
                beginAtZero: true
              },
              x: { grid: { display: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    };

    store.processCheckout = async function(e) {
      e.preventDefault();
      if (this.cart.length === 0) return;
      
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;

      if (!name || !phone || !cityId || !address) {
        showToast("Please fill all required recipient delivery coordinates.", "error");
        return;
      }

      this.checkoutLoading = true;
      this.updateDOM();

      try {
        const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);
        const cityObj = this.deliveryCities.find(c => c.id === cityId);
        const deliveryFee = cityObj ? cityObj.price : 0;
        const cityName = cityObj ? cityObj.name : "Morocco";
        const total = subtotal + deliveryFee;
        const orderId = "BP-" + Math.floor(100000 + Math.random() * 900000);

        const orderItems = this.cart.map(item => ({
          id: item.id,
          name: item.name,
          quantity: item.quantity,
          price: item.discountPrice || item.price
        }));

        const newOrder = {
          orderId,
          items: orderItems,
          total,
          subtotal,
          deliveryFee,
          deliveryCity: cityName,
          customerName: name,
          phone,
          address,
          status: "pending",
          paymentMethod: "Telegram Automated",
          createdAt: new Date()
        };

        // Write directly to standard orders collection in Firestore
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        await addDoc(ordersCol, newOrder);

        // Update live stats
        const analyticsRef = doc(db, 'artifacts', appId, 'public', 'data', 'analytics', 'live');
        try {
          await updateDoc(analyticsRef, {
            dailyRevenue: increment(total),
            dailyOrders: increment(1)
          });
        } catch(err) {
          console.warn("Analytics telemetry bypassed.", err);
        }

        // Build elegant product text list
        let productsMsg = "";
        this.cart.forEach(item => {
          productsMsg += `• *${item.name}* x${item.quantity} (${item.discountPrice || item.price} MAD)\n`;
        });

        // Parse custom message template dynamically
        let msgText = this.telegramSettings.template
          .replace(/{products}/g, productsMsg.trim())
          .replace(/{subtotal}/g, subtotal)
          .replace(/{city}/g, cityName)
          .replace(/{delivery}/g, deliveryFee)
          .replace(/{total}/g, total)
          .replace(/{name}/g, name)
          .replace(/{address}/g, address)
          .replace(/{phone}/g, phone)
          .replace(/{orderId}/g, orderId);

        // Dispatch Telegram Bot API Call
        if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
          try {
            const telegramUrl = `https://api.telegram.org/bot${this.telegramSettings.botToken}/sendMessage`;
            await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: this.telegramSettings.chatId,
                text: msgText,
                parse_mode: "Markdown"
              })
            });
          } catch (apiErr) {
            console.error("Direct Telegram bot execution failed.", apiErr);
          }
        }

        // Reset and clean environment state
        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "" };
        this.cartOpen = false;
        this.checkoutLoading = false;
        
        // Custom message on confirm
        triggerConfirm("Order Confirmed", "Your order is confirmed successfully! To ask where the order is, contact us via WhatsApp only.", () => {
          store.setPage("home");
        });

      } catch (err) {
        console.error(err);
        this.checkoutLoading = false;
        showToast("Fulfillment transaction pipeline failed. Please retry.", "error");
        this.updateDOM();
      }
    };

    store.createProductCardMarkup = function(product) {

            <div class="absolute top-4 left-4 flex flex-col gap-1.5">
              ${product.isPromotion ? `<span class="bg-red-600 text-[#FAF3E7] text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Promotion</span>` : ''}
              ${product.isBestSeller ? `<span class="bg-[#3D2A1C] text-[#FAF3E7] text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Bestseller</span>` : ''}
              ${product.limitedStock ? `<span class="bg-amber-600 text-white text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Limited</span>` : ''}
            </div>
          </div>

          <div class="p-6 space-y-4">
            <span class="text-[10px] uppercase tracking-widest text-luxuryGold font-semibold">${product.category}</span>
            <h3 class="font-serif text-lg text-coffeeBrown group-hover:text-luxuryGold transition cursor-pointer card-title-trigger" data-id="${product.id}">${product.name}</h3>
            
            <div class="flex items-center gap-1.5 text-xs">
              <span class="text-amber-500">${"★".repeat(Math.round(product.rating || 5))}</span>
              <span class="text-gray-400 font-light">(${product.reviewsCount || 12})</span>
            </div>

            <div class="space-y-3 pt-2">
              <div class="flex items-baseline gap-2">
                ${product.discountPrice ? `
                  <span class="text-lg font-bold text-darkBrown">${product.discountPrice} MAD</span>
                  <span class="text-xs line-through text-gray-400">${product.price} MAD</span>
                ` : `<span class="text-lg font-bold text-darkBrown">${product.price} MAD</span>`}
              </div>

              <div class="grid grid-cols-2 gap-2">
                <button class="add-to-cart-btn px-2 py-2 border border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-white text-[10px] uppercase font-bold tracking-wider rounded-lg transition duration-200" data-id="${product.id}">Add To Cart</button>
                <button class="order-now-btn px-2 py-2 bg-darkBrown hover:bg-coffeeBrown text-white text-[10px] uppercase font-bold tracking-wider rounded-lg transition duration-200 shadow-sm" data-id="${product.id}">Order Now</button>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    store.bindProductCardClicks = function() {
      document.querySelectorAll(".card-img-trigger, .card-title-trigger").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod);
        };
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.addToCart(prod);
        };
      });

      document.querySelectorAll(".order-now-btn").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) {
            store.cart = [{ ...prod, quantity: 1 }];
            localStorage.setItem("bp_cart", JSON.stringify(store.cart));
            store.cartOpen = true;
            document.getElementById("cart-drawer-overlay").classList.remove("hidden");
            store.renderCartDrawer();
          }
        };
      });
    };

    store.renderShopPage = function() {
      const container = document.getElementById("app-content");
      
      const filtered = this.products.filter(p => {
        const matchesCategory = this.selectedCategory === "All" || p.category === this.selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(this.searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      let productsGrid = "";
      if (this.loadingProducts && filtered.length === 0) {
        productsGrid = Array(6).fill(this.createSkeletonCardMarkup()).join('');
      } else {
        productsGrid = filtered.map(p => this.createProductCardMarkup(p)).join('');
      }

      let categoryButtons = `
        <button class="category-filter-btn text-left px-4 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-premium ${
          this.selectedCategory === "All" ? 'bg-luxuryGold text-white shadow-sm' : 'text-coffeeBrown hover:bg-luxuryBeige/45'
        }" data-name="All">All Compositions</button>
      `;

      categoryButtons += this.categories.filter(c => c.isActive).map(c => `
        <button class="category-filter-btn text-left px-4 py-2.5 rounded-xl text-xs font-semibold tracking-wide transition-premium ${
          this.selectedCategory === c.name ? 'bg-luxuryGold text-white shadow-sm' : 'text-coffeeBrown hover:bg-luxuryBeige/45'
        }" data-name="${c.name}">${c.name}</button>
      `).join('');

      container.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
          <div class="text-center space-y-3 mb-12">
            <span class="text-xs uppercase tracking-widest text-luxuryGold font-semibold">Atelier Collections</span>
            <h1 class="text-4xl font-serif text-darkBrown">La Boutique</h1>
            <div class="w-12 h-0.5 bg-luxuryGold mx-auto mt-4"></div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-4 gap-10">
            <!-- Sidebar Navigation Categories -->
            <div class="lg:col-span-1 space-y-6">
              <div class="bg-white/60 p-6 rounded-3xl border border-luxuryGold/15 shadow-sm space-y-4">
                <p class="text-[10px] font-bold text-coffeeBrown uppercase tracking-wider border-b border-luxuryGold/10 pb-2">Filter by Atelier</p>
                <div class="flex flex-col gap-1.5">
                  ${categoryButtons}
                </div>
              </div>
            </div>

            <!-- Products Segment -->
            <div class="lg:col-span-3">
              ${filtered.length === 0 ? `
                <div class="text-center py-16 bg-white/40 rounded-3xl border border-luxuryGold/10">
                  <p class="text-sm text-gray-500 italic">No elegant compositions match your criteria currently.</p>
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  ${productsGrid}
                </div>
              `}
            </div>
          </div>
        </div>
      `;

      // Bind filter handlers
      document.querySelectorAll(".category-filter-btn").forEach(btn => {
        btn.onclick = () => {
          store.selectedCategory = btn.getAttribute("data-name");
          store.renderShopPage();
        };
      });

      this.bindProductCardClicks();
    };

    store.renderAdminSubView = function() {
      const container = document.getElementById("admin-view-content");
      if (!container) return;

      if (this.adminView === "dashboard") {
        this.renderAdminDashboard(container);
      } else if (this.adminView === "products") {
        this.renderAdminProducts(container);
      } else if (this.adminView === "orders") {
        this.renderAdminOrders(container);
      } else if (this.adminView === "reviews") {
        this.renderAdminReviews(container);
      } else if (this.adminView === "delivery") {
        this.renderAdminDelivery(container);
      } else if (this.adminView === "categories") {
        this.renderAdminCategories(container);
      } else if (this.adminView === "lookbook") {
        this.renderAdminLookbook(container);
      } else if (this.adminView === "telegram-settings") {
        this.renderAdminTelegramSettings(container);
      }
    };

    store.renderCartDrawer = function() {
      const container = document.getElementById("cart-drawer-overlay");
      if (!this.cartOpen) {
        container.classList.add("hidden");
        return;
      }

      // Preserve current user input values from DOM before re-rendering
      const existingName = document.querySelector("input[name='customerName']")?.value;
      const existingPhone = document.querySelector("input[name='phone']")?.value;
      const existingAddress = document.querySelector("textarea[name='address']")?.value;
      const existingCityId = document.getElementById("checkout-city-select")?.value;

      if (existingName !== undefined) this.checkoutFormValues.customerName = existingName;
      if (existingPhone !== undefined) this.checkoutFormValues.phone = existingPhone;
      if (existingAddress !== undefined) this.checkoutFormValues.address = existingAddress;
      if (existingCityId !== undefined) this.checkoutFormValues.cityId = existingCityId;

      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      // Selected delivery city dynamic calculations
      const selectedCityId = this.checkoutFormValues.cityId;
      const cityObj = this.deliveryCities.find(c => c.id === selectedCityId);
      const deliveryFee = cityObj ? cityObj.price : 0;
      const total = subtotal + deliveryFee;

      let itemsMarkup = this.cart.map(item => `
        <div class="flex gap-4 p-3 bg-white/60 rounded-xl border border-luxuryGold/10 hover:border-luxuryGold/35 transition">
          <img src="${item.imageURL || fallbackImage}" class="w-20 h-20 object-cover rounded-lg border border-luxuryGold/20" loading="lazy">
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-serif text-sm text-darkBrown font-medium line-clamp-1">${item.name}</h4>
              <p class="text-xs text-luxuryGold font-semibold mt-0.5">${item.discountPrice || item.price} MAD</p>
            </div>
            <div class="flex justify-between items-center mt-2">
              <div class="flex items-center border border-luxuryGold/30 rounded-lg overflow-hidden bg-white">
                <button class="cart-qty-minus px-2.5 py-1 hover:bg-luxuryBeige/50 text-xs font-bold" data-id="${item.id}">-</button>
                <span class="px-3 text-xs font-semibold">${item.quantity}</span>
                <button class="cart-qty-plus px-2.5 py-1 hover:bg-luxuryBeige/50 text-xs font-bold" data-id="${item.id}">+</button>
              </div>
              <button class="cart-remove-item text-xs text-red-500 hover:text-red-700 transition" data-id="${item.id}">Remove</button>
            </div>
          </div>
        </div>

      container.innerHTML = `
        <div class="absolute inset-0 bg-black/65 backdrop-blur-xs transition-opacity" id="cart-drawer-backdrop"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
          <div class="w-screen max-w-md bg-[#FAF3E7] border-l border-luxuryGold/30 flex flex-col shadow-2xl">
            <div class="p-6 border-b border-luxuryGold/20 flex justify-between items-center bg-[#F5E6D3]/40">
              <h2 class="text-xl font-serif text-coffeeBrown flex items-center gap-2">
                ${getIconSvg('shopping-bag', 'text-luxuryGold w-6 h-6')} Your Selection
              </h2>
              <button id="cart-drawer-close" class="p-2 hover:text-luxuryGold transition rounded-full hover:bg-white/40">✕</button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-4">
              ${cartCount === 0 ? `
                <div class="text-center py-12 space-y-4">
                  <div class="text-luxuryGold/30 animate-spin" style="animation-duration: 8s">${getIconSvg('flower', 'w-16 h-16 mx-auto')}</div>
                  <p class="font-serif text-lg text-coffeeBrown">Your luxury cart is empty</p>
                  <button id="cart-drawer-shop-btn" class="mt-4 px-6 py-2 bg-luxuryGold text-white text-xs font-bold uppercase rounded-lg">Browse Boutique</button>
                </div>
              ` : itemsMarkup}
            </div>

            ${cartCount > 0 ? `
              <div class="p-6 border-t border-luxuryGold/30 bg-[#F5E6D3]/30 space-y-4">
                <div class="flex justify-between items-center text-sm font-medium">
                  <span class="text-coffeeBrown">Subtotal</span>
                  <span class="text-xl font-serif font-bold text-darkBrown">${subtotal} MAD</span>
                </div>

                ${selectedCityId ? `
                  <div class="flex justify-between items-center text-sm font-medium border-t border-luxuryGold/10 pt-2">
                    <span class="text-coffeeBrown">Delivery Fee</span>
                    <span class="font-serif font-bold text-darkBrown">${deliveryFee} MAD</span>
                  </div>
                  <div class="flex justify-between items-center text-sm font-bold border-t border-luxuryGold/20 pt-2">
                    <span class="text-coffeeBrown">Total</span>
                    <span class="text-xl font-serif font-bold text-darkBrown">${total} MAD</span>
                  </div>
                ` : ''}

                <div class="bg-white/70 p-4 rounded-xl border border-luxuryGold/20">
                  <p class="text-xs font-semibold text-coffeeBrown mb-3 uppercase">Delivery Coordinates</p>
                  <form id="checkout-form" class="space-y-3">
                    <input type="text" name="customerName" required placeholder="Full Name" value="${this.checkoutFormValues.customerName}" class="w-full px-3 py-2 text-xs rounded-lg border border-luxuryGold/30 focus:outline-none focus:border-luxuryGold bg-white">

                      ${this.checkoutLoading ? "Processing Masterpiece..." : "Order & Confirm Luxury Request"}
                      ${getIconSvg('send', 'w-3.5 h-3.5')}
                    </button>
                  </form>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      // Set Drawer Action Listeners
      document.getElementById("cart-drawer-backdrop").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      document.getElementById("cart-drawer-close").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      
      const shopBtn = document.getElementById("cart-drawer-shop-btn");
      if (shopBtn) {
        shopBtn.onclick = () => { store.cartOpen = false; store.setPage("shop"); };
      }

      document.querySelectorAll(".cart-qty-minus").forEach(btn => {
        btn.onclick = () => store.updateQty(btn.getAttribute("data-id"), -1);
      });

      document.querySelectorAll(".cart-qty-plus").forEach(btn => {
        btn.onclick = () => store.updateQty(btn.getAttribute("data-id"), 1);
      });

      document.querySelectorAll(".cart-remove-item").forEach(btn => {
        btn.onclick = () => store.removeFromCart(btn.getAttribute("data-id"));
      });

      const citySelect = document.getElementById("checkout-city-select");
      if (citySelect) {
        citySelect.onchange = () => store.renderCartDrawer();
      }

      const checkoutForm = document.getElementById("checkout-form");
      if (checkoutForm) {
        checkoutForm.onsubmit = (e) => store.processCheckout(e);
      }
    };

            <button id="product-modal-close" class="absolute top-4 right-4 z-20 p-2 text-white bg-darkBrown/50 rounded-full hover:bg-luxuryGold transition-premium">✕</button>

            <!-- Image View Container -->
            <div class="md:w-1/2 h-64 md:h-auto relative overflow-hidden group/main cursor-zoom-in" id="zoom-img-btn">
              <img src="${this.activeImg || fallbackImage}" class="w-full h-full object-cover transition-premium transform group-hover/main:scale-105">
              ${product.isPromotion ? `<span class="absolute top-4 left-4 bg-red-600 text-white text-[10px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Collection Sale</span>` : ''}
              <div class="absolute inset-0 bg-black/20 opacity-0 group-hover/main:opacity-100 transition flex items-center justify-center">
                <span class="bg-white/90 backdrop-blur-md text-darkBrown text-xs uppercase tracking-widest font-extrabold px-4 py-2 rounded-full flex items-center gap-2">Inspect</span>
              </div>
            </div>

            <!-- Details Container -->
            <div class="md:w-1/2 p-10 flex flex-col justify-between overflow-y-auto max-h-[85vh] md:max-h-[600px] space-y-6">
              <div class="space-y-4">
                <span class="text-xs uppercase tracking-widest text-luxuryGold font-extrabold">${product.category}</span>
                <h2 class="text-3xl font-serif text-coffeeBrown font-bold tracking-tight">${product.name}</h2>
                
                <div class="flex items-center gap-1">
                  <span class="text-amber-500">${"★".repeat(Math.round(product.rating || 5))}</span>
                  <span class="text-xs text-coffeeBrown font-semibold ml-1">${product.rating || 5.0} (${product.reviewsCount || 0} reviews)</span>
                </div>

                <div class="flex items-baseline gap-3 pt-2">
                  ${product.discountPrice ? `
                    <span class="text-3xl font-serif font-bold text-darkBrown">${product.discountPrice} MAD</span>
                    <span class="text-sm line-through text-gray-400">${product.price} MAD</span>
                  ` : `<span class="text-3xl font-serif font-bold text-darkBrown">${product.price} MAD</span>`}
                </div>

                <div class="border-t border-b border-luxuryGold/20 py-4 space-y-2">
                  <p class="text-xs font-semibold text-coffeeBrown uppercase">Gallery</p>
                  <div class="flex gap-3 overflow-x-auto py-1.5 hide-scrollbar">
                    ${galleryMarkup}
                  </div>
                </div>

                <p class="text-sm text-gray-600 leading-relaxed font-light">${product.description}</p>
                <p class="text-xs font-medium text-coffeeBrown">
                  Stock Status: ${product.limitedStock ? `<span class="text-red-600 font-bold">Limited Reserve (${product.stock} left)</span>` : `<span class="text-emerald-700 font-bold">In Stock</span>`}
                </p>
              </div>

              <div class="space-y-4 pt-4 border-t border-luxuryGold/10">
                <div class="grid grid-cols-2 gap-3">
                  <button id="modal-add-to-cart-btn" class="py-3.5 border border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-white font-extrabold uppercase tracking-widest text-[11px] rounded-xl transition shadow-xs">Add To Cart</button>
                  <button id="modal-order-now-btn" class="py-3.5 bg-darkBrown hover:bg-coffeeBrown text-white font-extrabold uppercase tracking-widest text-[11px] rounded-xl transition transform hover:scale-[1.02]">Order Now</button>
                </div>
                <p class="text-[10px] text-center text-gray-400">🚚 Free customized premium card included with every masterpiece.</p>
              </div>
            </div>
          </div>
        `;

        document.getElementById("product-modal-backdrop").onclick = () => modal.classList.add("hidden");
        document.getElementById("product-modal-close").onclick = () => modal.classList.add("hidden");

        const mainThumb = document.getElementById("main-thumb-btn");
        if (mainThumb) {
          mainThumb.onclick = () => {
            store.activeImg = product.imageURL;
            renderInsideModal();
          };
        }

        document.querySelectorAll("[data-url]").forEach(btn => {
          btn.onclick = () => {
            store.activeImg = btn.getAttribute("data-url");
            renderInsideModal();
          };
        });

        document.getElementById("zoom-img-btn").onclick = () => {
          const lightbox = document.getElementById("lightbox-container");
          lightbox.innerHTML = `
            <button id="lightbox-close" class="absolute top-6 right-6 z-50 p-3 text-white bg-white/10 hover:bg-white/20 rounded-full transition-premium">✕</button>
            <div class="max-w-4xl w-full h-full max-h-[85vh] flex items-center justify-center p-4">
              <img src="${store.activeImg || fallbackImage}" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl border-2 border-luxuryGold/30">
            </div>
          `;
          lightbox.classList.remove("hidden");
          document.getElementById("lightbox-close").onclick = () => lightbox.classList.add("hidden");
        };

        document.getElementById("modal-add-to-cart-btn").onclick = () => {
          store.addToCart(product);
          modal.classList.add("hidden");
        };

        document.getElementById("modal-order-now-btn").onclick = () => {
          store.cart = [{ ...product, quantity: 1 }];
          localStorage.setItem("bp_cart", JSON.stringify(store.cart));
          modal.classList.add("hidden");
          store.cartOpen = true;
          document.getElementById("cart-drawer-overlay").classList.remove("hidden");
          store.renderCartDrawer();
        };
      };

      renderInsideModal();
      modal.classList.remove("hidden");
    };

    store.renderFloatingActions = function() {
      const container = document.getElementById("floating-actions");
      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      container.innerHTML = `
        <!-- Floating WhatsApp Help Chat Action -->
        <a href="${WHATSAPP_LINK}" target="_blank" class="fixed bottom-6 left-6 z-40 bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition hover:scale-110" title="Chat with Support on WhatsApp">
          ${getIconSvg('message-circle', 'w-6 h-6')}
        </a>

        <!-- Sticky Mobile cart CTA bar -->
        ${cartCount > 0 ? `
          <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 border-t border-luxuryGold/30 px-6 py-4 flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-2">
              ${getIconSvg('shopping-bag', 'text-luxuryGold w-5 h-5')}
              <div>
                <p class="text-xs text-gray-500">Your Selection</p>
                <p class="text-sm font-bold text-darkBrown">${subtotal} MAD</p>
              </div>
            </div>
            <button id="sticky-mobile-checkout-btn" class="bg-luxuryGold text-white px-5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider">Order Now</button>
          </div>
        ` : ''}
      `;

      const stickyBtn = document.getElementById("sticky-mobile-checkout-btn");
      if (stickyBtn) {
        stickyBtn.onclick = () => {
          store.cartOpen = true;
          document.getElementById("cart-drawer-overlay").classList.remove("hidden");
          store.renderCartDrawer();
        };
      }
    };

    const hidePreloader = () => {
      const preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        preloader.style.visibility = 'hidden';
        setTimeout(() => preloader.remove(), 400);
      }
    };

    const preloaderTimeout = setTimeout(hidePreloader, 1200);

    document.addEventListener("DOMContentLoaded", () => {
      store.updateDOM();

      signInAnonymously(auth)
        .then(() => {
          store.initPublicSubscriptions();
        })
        .catch(err => {
          console.warn("Firebase Auth Offline Fallback:", err);
          store.initPublicSubscriptions();
        });

      onAuthStateChanged(auth, (usr) => {
        if (usr) {
          store.user = usr;
        }
      });

      clearTimeout(preloaderTimeout);
      hidePreloader();
    });
  </script>
</body>
</html>
