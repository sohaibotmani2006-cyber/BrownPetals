      color: #E5E5E5;

    }

      background: linear-gradient(135deg, #0A0A0A 0%, #141414 100%);
    }
    .pink-luxury-gradient {
      background: linear-gradient(135deg, #121212 0%, #181818 50%, #FF66B2 100%);
    }
    .blue-luxury-gradient {
      background: linear-gradient(135deg, #121212 0%, #0A0A0A 50%, #1E90FF 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
    }
    .dark-gradient {
      background: linear-gradient(135deg, #141414 0%, #000000 100%);
    }
    .glassmorphism {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .transition-premium {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0A0A0A;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 3px;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    @keyframes preloader-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }

      const body = document.body;
      body.classList.remove('theme-girls', 'theme-boys');

      if (this.selectedGenderSection === "GIRLS STORE") {
        body.classList.add('theme-girls');
      } else if (this.selectedGenderSection === "BOYS STORE") {

        "shopping-cart": `<g><circle cx="9" cy="21" r="1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><circle cx="20" cy="21" r="1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" /></g>`,

    store.createSkeletonCardMarkup = function() {
      return `
        <div class="animate-pulse bg-[#141414] rounded-3xl overflow-hidden border border-luxuryGold/10 shadow-md p-6 space-y-4">
          <div class="h-80 bg-luxuryGold/5 rounded-2xl"></div>
          <div class="space-y-2">
            <div class="h-3 bg-luxuryGold/20 rounded w-1/4"></div>
            <div class="h-5 bg-white/10 rounded w-3/4"></div>
            <div class="h-3 bg-white/5 rounded w-1/2"></div>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <div class="h-8 bg-luxuryGold/10 rounded-lg"></div>
            <div class="h-8 bg-white/5 rounded-lg"></div>
          </div>
        </div>
      `;
    };

    const showToast = (message, type = "success") => {
      const container = document.getElementById("toast-center");
      if (!container) return;
      const id = "toast-" + Date.now();
      const markup = `
        <div id="${id}" class="fixed top-6 right-6 z-50 flex items-center gap-3 px-6 py-4 rounded-xl shadow-2xl transition-premium border ${
          type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' : 'bg-[#141414]/95 border-luxuryGold text-white'
        }">
          <div class="w-2.5 h-2.5 rounded-full bg-luxuryGold animate-ping"></div>
          <span class="font-medium text-sm tracking-wide">${message}</span>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', markup);
      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.remove();
      }, 3500);
    };

    const showFirebaseDiagnosticModal = (title, reason) => {
      const modal = document.getElementById("diagnostic-modal-container");
      if (!modal) return;
      modal.innerHTML = `
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md"></div>
        <div class="relative bg-[#141414] p-8 rounded-3xl max-w-lg w-full border-2 border-luxuryGold/50 shadow-2xl z-20 space-y-6 text-left">
          <div class="flex items-center gap-3 border-b border-luxuryGold/20 pb-3">
            <div class="w-8 h-8 rounded-full bg-luxuryGold/10 text-luxuryGold flex items-center justify-center">⚠️</div>
            <h3 class="font-serif text-xl text-luxuryGold font-bold">${title}</h3>
          </div>
          
          <div class="space-y-4 text-xs text-gray-300 leading-relaxed">
            <div class="font-semibold text-red-400">Diagnosis: <span class="font-light text-gray-300">${reason}</span></div>
            
            <div class="bg-black/40 p-4 rounded-xl space-y-3 border border-white/5">
              <p class="font-bold uppercase tracking-wider text-luxuryGold text-[10px]">How to configure Firebase Firestore:</p>
              <ol class="list-decimal list-inside space-y-2 text-gray-400">
                <li>Go to your <a href="https://console.firebase.google.com/" target="_blank" class="text-luxuryGold underline">Firebase Console</a>.</li>
                <li>Click <strong>Firestore Database</strong> and ensure the database is actually created.</li>
                <li>Under Firestore <strong>Rules</strong>, make sure they allow read/write access.</li>
                <li>Under <strong>Authentication ➔ Sign-in method</strong>, make sure the <strong>Anonymous</strong> sign-in provider is enabled.</li>
                <li><strong>Where to find the data:</strong> Refresh your Firestore. Your records are located nested under: <br><span class="text-luxuryGold font-mono">artifacts ➔ sovanex ➔ public ➔ data ➔ products / orders</span>.</li>
              </ol>
            </div>
          </div>

          <div class="flex justify-end pt-2">
            <button id="diagnostic-close-btn" class="px-5 py-2.5 bg-luxuryGold text-black rounded-xl text-xs uppercase font-extrabold tracking-wider hover:bg-luxuryGold/80 transition">Got It</button>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      document.getElementById("diagnostic-close-btn").onclick = () => modal.classList.add("hidden");
    };

    const triggerConfirm = (title, message, onConfirmCallback) => {
      const modal = document.getElementById("confirm-modal-container");
      if (!modal) return;
      modal.innerHTML = `
        <div class="absolute inset-0 bg-black/80 backdrop-blur-xs"></div>
        <div class="relative bg-[#141414] p-6 rounded-2xl max-w-sm w-full border border-luxuryGold/30 shadow-2xl z-10 text-center space-y-4">
          <h3 class="font-serif text-lg text-luxuryGold font-bold">${title}</h3>
          <p class="text-xs text-gray-400 font-light leading-relaxed">${message}</p>
          <div class="flex gap-3 justify-center pt-2">
            <button id="confirm-cancel-btn" class="px-4 py-2 bg-black/40 text-gray-400 rounded-lg text-xs uppercase font-bold tracking-wider border border-white/10 hover:bg-white/5 transition">Cancel</button>
            <button id="confirm-submit-btn" class="px-4 py-2 bg-red-700 text-white rounded-lg text-xs uppercase font-bold tracking-wider hover:bg-red-800 transition shadow-md">Confirm</button>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      
      document.getElementById("confirm-cancel-btn").onclick = () => modal.classList.add("hidden");
      document.getElementById("confirm-submit-btn").onclick = () => {
        onConfirmCallback();
        modal.classList.add("hidden");
      };
    };

    store.initPublicSubscriptions = function(forceBypass = false) {
      if (this.activeSubscriptions.public) return;
      if (!auth.currentUser && !forceBypass) return;
      this.activeSubscriptions.public = true;

    store.addToCart = function(product) {
      const match = this.cart.find(item => item.id === product.id);
      if (match) {
        if (product.stock && match.quantity >= product.stock) {
          showToast(`Only ${product.stock} pieces remaining of exclusive stock.`, "error");
          return;
        }
        match.quantity += 1;
      } else {
        this.cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      showToast(`"${product.name}" selected.`);
      this.updateDOM();
    };

    store.updateQty = function(id, delta) {
      const match = this.cart.find(item => item.id === id);
      if (!match) return;
      match.quantity += delta;
      if (match.quantity <= 0) {
        this.cart = this.cart.filter(item => item.id !== id);
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    store.removeFromCart = function(id) {
      this.cart = this.cart.filter(item => item.id !== id);
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();
    };

    // Chart.js Lazy Loader
    let chartLoaderPromise = null;
    const loadChartLibrary = () => {
      if (chartLoaderPromise) return chartLoaderPromise;
      chartLoaderPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js";
        script.onload = () => resolve(window.Chart);
        script.onerror = () => reject(new Error("Analytics Engine Load Failure"));
        document.head.appendChild(script);
      });
      return chartLoaderPromise;
    };

    store.renderAnalyticsChart = function() {
      const canvas = document.getElementById("analyticsChart");
      if (!canvas) return;

      loadChartLibrary().then((Chart) => {
        const nonCancelled = store.orders.filter(o => o.status !== 'cancelled');
        const dailySales = {};
        const labels = [];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const dayLabel = `${dayNames[d.getDay()]} (${dateString})`;
          labels.push(dayLabel);
          dailySales[dateString] = 0;
        }

        nonCancelled.forEach(order => {
          if (order.createdAt) {
            const orderDate = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
            const dateKey = orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            if (dailySales[dateKey] !== undefined) {
              dailySales[dateKey] += order.total;
            }
          }
        });

        const dataset = Object.keys(dailySales).map(key => dailySales[key]);

        if (window.analyticsChartInstance) {
          window.analyticsChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 240);
        gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
        gradient.addColorStop(1, 'rgba(10, 10, 10, 0.05)');

        window.analyticsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Daily Revenue (MAD)',
              data: dataset,
              borderColor: 'var(--accent-color)',
              borderWidth: 3,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#000000',
              pointBorderColor: 'var(--accent-color)',
              pointRadius: 6,
              pointHoverRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                grid: { color: 'rgba(212, 175, 55, 0.08)' },
                min: 0,
                beginAtZero: true
              },
              x: { grid: { display: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    };

    store.processCheckout = async function(e) {
      e.preventDefault();
      
      if (this.cart.length === 0) return;
      
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;

      if (!name || !phone || !cityId || !address) {
        showToast("Please fill all required recipient delivery coordinates.", "error");
        return;
      }

      this.checkoutLoading = true;
      this.updateDOM();

      try {
        const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);
        const cityObj = this.deliveryCities.find(c => c.id === cityId);
        const deliveryFee = cityObj ? cityObj.price : 0;
        const cityName = cityObj ? cityObj.name : "Morocco";
        const total = subtotal + deliveryFee;
        const orderId = "SOV-" + Math.floor(100000 + Math.random() * 900000);

        const orderItems = this.cart.map(item => ({
          id: item.id,
          name: item.name,
          quantity: item.quantity,
          price: item.discountPrice || item.price
        }));

        const newOrder = {
          orderId,
          items: orderItems,
          total,
          subtotal,
          deliveryFee,
          deliveryCity: cityName,
          customerName: name,
          phone,
          address,
          status: "pending",
          paymentMethod: "Telegram Automated",
          createdAt: new Date()
        };

        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        await addDoc(ordersCol, newOrder);

        let productsMsg = "";
        this.cart.forEach(item => {
          productsMsg += `• *${item.name}* x${item.quantity} (${item.discountPrice || item.price} MAD)\n`;
        });

        let msgText = this.telegramSettings.template
          .replace(/{products}/g, productsMsg.trim())
          .replace(/{subtotal}/g, subtotal)
          .replace(/{city}/g, cityName)
          .replace(/{delivery}/g, deliveryFee)
          .replace(/{total}/g, total)
          .replace(/{name}/g, name)
          .replace(/{address}/g, address)
          .replace(/{phone}/g, phone)
          .replace(/{orderId}/g, orderId);

        if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
          try {
            const telegramUrl = `https://api.telegram.org/bot${this.telegramSettings.botToken}/sendMessage`;
            await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: this.telegramSettings.chatId,
                text: msgText,
                parse_mode: "Markdown"
              })
            });
          } catch (apiErr) {
            console.error("Direct Telegram bot execution failed.", apiErr);
          }
        }

        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "" };
        this.cartOpen = false;
        this.checkoutLoading = false;
        
        triggerConfirm("Order Confirmed", "Your order has been registered successfully! To track shipping coordinates, kindly connect on WhatsApp.", () => {
          store.setPage("home");
        });

      } catch (err) {
        console.error(err);
        this.checkoutLoading = false;
        showToast("Fulfillment transaction pipeline failed. Please retry.", "error");
        showFirebaseDiagnosticModal(
          "Checkout Connection Blocked", 
          `Unable to register order to Firestore. Firebase error details: ${err.message}`
        );
        this.updateDOM();
      }
    };

    store.createProductCardMarkup = function(product) {
      const normalizedGender = getNormalizedGender(product.gender);
      const isGirls = normalizedGender === "GIRLS STORE";

      const badgeColor = isGirls ? 'bg-luxuryGold/10 text-luxuryGold' : 'bg-white/10 text-white';
      const btnOutlineColor = 'border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-black';
      const btnSolidColor = 'bg-luxuryGold hover:bg-luxuryGold/90 text-black';

      return `

          <div class="h-80 overflow-hidden relative cursor-pointer card-img-trigger" data-id="${product.id}">
            <img src="${product.imageURL || fallbackImage}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700" loading="lazy" decoding="async">
            <div class="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition"></div>
            
            <div class="absolute top-4 left-4 flex flex-col gap-1.5">
              ${product.isPromotion ? `<span class="bg-red-700 text-white text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Promotion</span>` : ''}
              ${product.isBestSeller ? `<span class="bg-[#000000] border border-luxuryGold/45 text-luxuryGold text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Bestseller</span>` : ''}
              ${product.limitedStock ? `<span class="bg-amber-600 text-white text-[9px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Limited</span>` : ''}
            </div>
            <div class="absolute bottom-4 right-4">
              <span class="${badgeColor} text-[10px] uppercase font-bold px-3 py-1.5 rounded-full shadow border border-luxuryGold/20">${normalizedGender}</span>
            </div>

    store.bindProductCardClicks = function() {
      document.querySelectorAll(".card-img-trigger, .card-title-trigger").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod);
        };
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.addToCart(prod);
        };
      });

      document.querySelectorAll(".order-now-btn").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) {
            store.cart = [{ ...prod, quantity: 1 }];
            localStorage.setItem("bp_cart", JSON.stringify(store.cart));
            store.cartOpen = true;
            document.getElementById("cart-drawer-overlay").classList.remove("hidden");
            store.renderCartDrawer();
          }
        };
      });

        const matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                              p.description.toLowerCase().includes(this.searchQuery.toLowerCase());
        return matchesGender && matchesCategory && matchesSearch;

        this.renderAdminTelegramSettings(container);

    store.renderCartDrawer = function() {
      const container = document.getElementById("cart-drawer-overlay");
      if (!container) return;
      if (!this.cartOpen) {
        container.classList.add("hidden");
        return;
      }

      const existingName = document.querySelector("input[name='customerName']")?.value;
      const existingPhone = document.querySelector("input[name='phone']")?.value;
      const existingAddress = document.querySelector("textarea[name='address']")?.value;
      const existingCityId = document.getElementById("checkout-city-select")?.value;

      if (existingName !== undefined) this.checkoutFormValues.customerName = existingName;
      if (existingPhone !== undefined) this.checkoutFormValues.phone = existingPhone;
      if (existingAddress !== undefined) this.checkoutFormValues.address = existingAddress;
      if (existingCityId !== undefined) this.checkoutFormValues.cityId = existingCityId;

      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      const selectedCityId = this.checkoutFormValues.cityId;
      const cityObj = this.deliveryCities.find(c => c.id === selectedCityId);
      const deliveryFee = cityObj ? cityObj.price : 0;
      const total = subtotal + deliveryFee;

      let itemsMarkup = this.cart.map(item => `
        <div class="flex gap-4 p-3 bg-black/60 rounded-xl border border-luxuryGold/10 hover:border-luxuryGold/35 transition">
          <img src="${item.imageURL || fallbackImage}" class="w-20 h-20 object-cover rounded-lg border border-luxuryGold/20" loading="lazy">

            <div>
              <h4 class="font-serif text-sm text-white font-medium line-clamp-1">${item.name}</h4>
              <p class="text-xs text-luxuryGold font-semibold mt-0.5">${item.discountPrice || item.price} MAD</p>
            </div>
            <div class="flex justify-between items-center mt-2">
              <div class="flex items-center border border-luxuryGold/30 rounded-lg overflow-hidden bg-black">
                <button class="cart-qty-minus px-2.5 py-1 hover:bg-white/5 text-xs font-bold" data-id="${item.id}">-</button>
                <span class="px-3 text-xs font-semibold text-white">${item.quantity}</span>

              <h2 class="text-xl font-serif text-luxuryGold flex items-center gap-2">

              <button id="cart-drawer-close" class="p-2 hover:text-luxuryGold transition rounded-full hover:bg-white/5">✕</button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 space-y-4">
              ${cartCount === 0 ? `
                <div class="text-center py-12 space-y-4">
                  <div class="text-luxuryGold/30 animate-spin" style="animation-duration: 8s">${getIconSvg('flower', 'w-16 h-16 mx-auto')}</div>
                  <p class="font-serif text-lg text-luxuryGold">Your cart is empty</p>
                  <button id="cart-drawer-shop-btn" class="mt-4 px-6 py-2 bg-luxuryGold text-black text-xs font-bold uppercase rounded-lg">La Boutique</button>
                </div>

            ${cartCount > 0 ? `
              <div class="p-6 border-t border-luxuryGold/30 bg-[#141414] space-y-4">
                <div class="flex justify-between items-center text-sm font-medium">
                  <span class="text-gray-300">Subtotal</span>
                  <span class="text-xl font-serif font-bold text-luxuryGold">${subtotal} MAD</span>

                    <span class="font-serif font-bold text-luxuryGold">${deliveryFee} MAD</span>
                  </div>
                  <div class="flex justify-between items-center text-sm font-bold border-t border-white/10 pt-2">
                    <span class="text-gray-300">Total</span>
                    <span class="text-xl font-serif font-bold text-luxuryGold">${total} MAD</span>

                  </form>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;

      document.getElementById("cart-drawer-backdrop").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      document.getElementById("cart-drawer-close").onclick = () => { store.cartOpen = false; store.renderCartDrawer(); };
      
      const shopBtn = document.getElementById("cart-drawer-shop-btn");
      if (shopBtn) {
        shopBtn.onclick = () => { store.cartOpen = false; store.setPage("shop"); };

        btn.onclick = () => store.updateQty(btn.getAttribute("data-id"), 1);
      });

      document.querySelectorAll(".cart-remove-item").forEach(btn => {
        btn.onclick = () => store.removeFromCart(btn.getAttribute("data-id"));
      });

      const citySelect = document.getElementById("checkout-city-select");
      if (citySelect) {
        citySelect.onchange = () => store.renderCartDrawer();
      }

      const checkoutForm = document.getElementById("checkout-form");
      if (checkoutForm) {
        checkoutForm.onsubmit = (e) => store.processCheckout(e);
      }

                <div class="flex items-baseline gap-3 pt-2">
                  ${product.discountPrice ? `
                    <span class="text-3xl font-serif font-bold text-luxuryGold">${product.discountPrice} MAD</span>
                    <span class="text-sm line-through text-gray-500">${product.price} MAD</span>
                  ` : `<span class="text-3xl font-serif font-bold text-white">${product.price} MAD</span>`}
                </div>

                <div class="border-t border-b border-luxuryGold/20 py-4 space-y-2">
                  <p class="text-xs font-semibold text-luxuryGold mb-1 uppercase">Gallery</p>
                  <div class="flex gap-3 overflow-x-auto py-1.5 hide-scrollbar">
                    ${galleryMarkup}
                  </div>
                </div>

                <p class="text-sm text-gray-300 leading-relaxed font-light">${product.description}</p>
                <p class="text-xs font-medium text-gray-400">
                  Stock Status: ${product.limitedStock ? `<span class="text-red-400 font-bold">Limited Reserve (${product.stock} left)</span>` : `<span class="text-emerald-400 font-bold">In Stock</span>`}
                </p>
              </div>

              <div class="space-y-4 pt-4 border-t border-white/5">
                <div class="grid grid-cols-2 gap-3">
                  <button id="modal-add-to-cart-btn" class="py-3.5 border border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-black font-extrabold uppercase tracking-widest text-[11px] rounded-xl transition shadow-xs">Add To Cart</button>
                  <button id="modal-order-now-btn" class="py-3.5 bg-luxuryGold hover:bg-luxuryGold/90 text-black font-extrabold uppercase tracking-widest text-[11px] rounded-xl transition transform hover:scale-[1.02]">Order Now</button>
                </div>
                <p class="text-[10px] text-center text-gray-500">🚚 Free customized premium card included with every masterpiece.</p>
              </div>
            </div>
          </div>
        `;

        document.getElementById("product-modal-backdrop").onclick = () => modal.classList.add("hidden");
        document.getElementById("product-modal-close").onclick = () => modal.classList.add("hidden");

        const mainThumb = document.getElementById("main-thumb-btn");
        if (mainThumb) {
          mainThumb.onclick = () => {
            store.activeImg = product.imageURL;
            renderInsideModal();
          };
        }

        document.querySelectorAll("[data-url]").forEach(btn => {
          btn.onclick = () => {
            store.activeImg = btn.getAttribute("data-url");
            renderInsideModal();
          };
        });

        document.getElementById("zoom-img-btn").onclick = () => {
          const lightbox = document.getElementById("lightbox-container");
          if (!lightbox) return;
          lightbox.innerHTML = `
            <button id="lightbox-close" class="absolute top-6 right-6 z-50 p-3 text-white bg-white/10 hover:bg-white/20 rounded-full transition-premium">✕</button>
            <div class="max-w-4xl w-full h-full max-h-[85vh] flex items-center justify-center p-4">
              <img src="${store.activeImg || fallbackImage}" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl border-2 border-luxuryGold/30">
            </div>
          `;
          lightbox.classList.remove("hidden");
          document.getElementById("lightbox-close").onclick = () => lightbox.classList.add("hidden");
        };

        document.getElementById("modal-add-to-cart-btn").onclick = () => {
          store.addToCart(product);
          modal.classList.add("hidden");
        };

        document.getElementById("modal-order-now-btn").onclick = () => {
          store.cart = [{ ...product, quantity: 1 }];
          localStorage.setItem("bp_cart", JSON.stringify(store.cart));
          modal.classList.add("hidden");
          store.cartOpen = true;
          document.getElementById("cart-drawer-overlay").classList.remove("hidden");
          store.renderCartDrawer();
        };
      };

      renderInsideModal();
      modal.classList.remove("hidden");
    };

    store.renderFloatingActions = function() {
      const container = document.getElementById("floating-actions");
      if (!container) return;
      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      container.innerHTML = `
        <!-- Floating WhatsApp Help Chat Action -->
        <a href="https://wa.me/${(this.settings.whatsappHotline || '212777467304').replace(/\s+/g, '')}" target="_blank" class="fixed bottom-6 left-6 z-40 bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition hover:scale-110" title="Chat with Support on WhatsApp">
          ${getIconSvg('message-circle', 'w-6 h-6')}
        </a>

        <!-- Sticky Mobile cart CTA bar -->
        ${cartCount > 0 ? `
          <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#141414]/95 border-t border-luxuryGold/30 px-6 py-4 flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-2">
              ${getIconSvg('shopping-bag', 'text-luxuryGold w-5 h-5')}
              <div>
                <p class="text-xs text-gray-400">Your Selection</p>
                <p class="text-sm font-bold text-luxuryGold">${subtotal} MAD</p>
              </div>
            </div>
            <button id="sticky-mobile-checkout-btn" class="bg-luxuryGold text-black px-5 py-2 rounded-lg text-xs font-bold uppercase tracking-wider">Order Now</button>
          </div>
        ` : ''}
      `;

      const stickyBtn = document.getElementById("sticky-mobile-checkout-btn");
      if (stickyBtn) {
        stickyBtn.onclick = () => {
          store.cartOpen = true;
          document.getElementById("cart-drawer-overlay").classList.remove("hidden");
          store.renderCartDrawer();
        };
      }
    };

    const hidePreloader = () => {
      const preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        preloader.style.visibility = 'hidden';
        setTimeout(() => preloader.remove(), 400);
      }
    };

    const preloaderTimeout = setTimeout(hidePreloader, 1200);

    async function initAppSequence() {
      try {
        let user = auth.currentUser;
        if (!user) {
          const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (customToken) {
            try {
              const credential = await signInWithCustomToken(auth, customToken);
              user = credential.user;
            } catch (tokenError) {
              console.warn("Firebase Auth: Custom token mismatch. Bypassing to Anonymous Authentication.", tokenError);
              const credential = await signInAnonymously(auth);
              user = credential.user;
            }
          } else {
            const credential = await signInAnonymously(auth);
            user = credential.user;
          }
        }
        
        if (user) {
          store.user = user;
          store.initPublicSubscriptions();
          if (store.isAdmin) {
            store.initAdminSubscriptions();
          }
        }
      } catch (error) {
        console.error("Firebase Auth Failure:", error);
        
        if (error.code === 'auth/operation-not-allowed') {
          showFirebaseDiagnosticModal(
            "Anonymous Auth Disabled",
            "SOVANEX cannot identify connection credentials because 'Anonymous Sign-In' is disabled inside your Firebase Console."
          );
        } else {
          showFirebaseDiagnosticModal(
            "Firebase Initialization Alert",
            `Authentication returned: "${error.message}". Ensure your Firestore Rules allow connection access.`
          );
        }

        // Bypassing Auth guard for direct read
        store.initPublicSubscriptions(true); 
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      store.updateDOM();

      initAppSequence().then(() => {
        clearTimeout(preloaderTimeout);
        hidePreloader();
      });

      onAuthStateChanged(auth, (usr) => {
        if (usr) {
          store.user = usr;
          store.initPublicSubscriptions();
          
          if (usr.email === "bilalotami@gmail.com") {
            store.isAdmin = true;
            store.initAdminSubscriptions();
            if (store.currentPage === "admin") {
              store.renderAdminPage();
            }
          } else {
            store.isAdmin = false;
            if (usr.email && usr.email !== "bilalotami@gmail.com") {
              // Unrecognized Google user from a cached session is signed out & blocked
              signOut(auth).then(() => {
                showToast("Unauthorized account. Signed out.", "error");
                signInAnonymously(auth).catch(console.error);
                if (store.currentPage === "admin") store.setPage("home");
              });
            }
          }
        } else {
           // Provide fallback to anonymous viewing when logged out
           signInAnonymously(auth).catch(console.error);
        }
      });
    });
  </script>
</body>
</html>
