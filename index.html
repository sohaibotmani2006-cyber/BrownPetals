      0%, 100% { transform: translateY(0px) rotate(0deg); }

    @keyframes float-fast {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(2deg); }

      0%, 100% { opacity: 0.35; transform: scale(1); }

      0% { background-position: -200% center; }

    }
    @keyframes subtle-drift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes slow-pan {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

        const hash = window.location.hash;
        if (!hash || hash === "#" || hash === "#/") {
          window.location.hash = "#/home";
          return;
        }

        if (hash.startsWith("#/product/")) {
          const prodId = hash.replace("#/product/", "");
          if (this.currentPage === "admin") {
            this.currentPage = "shop";
          }
          this.updateDOM();
          
          if (this.products.length > 0) {
            const prod = this.products.find(p => p.id === prodId);
            if (prod) {
              this.openProductDetailsModal(prod);
            }
          }
          return;
        }

        const page = hash.replace("#/", "");
        const validPages = ["home", "shop", "contact", "policies", "admin", "cart", "order-confirmation"];
        if (validPages.includes(page)) {
          const pageChanged = (this.currentPage !== page);
          this.currentPage = page;
          if (page === "admin" && this.isAdmin) {
            this.initAdminSubscriptions();
          }
          const modal = document.getElementById("product-detail-container");
          if (modal) modal.classList.add("hidden");

          if (pageChanged) {
            this.updateDOM();
          }
        } else {
          window.location.hash = "#/home";
        }

        textArea.select();

    store.fetchMyOrders = async function() {
      const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
      if (localHistory.length === 0) {
        this.myOrders = [];
        this.loadingMyOrders = false;

      this.loadingMyOrders = true;

      try {
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const q = query(ordersCol, where("orderId", "in", localHistory.slice(-10))); // Securely get secure logs
        const snap = await getDocs(q);
        const list = [];
        snap.forEach(doc => {
          list.push({ id: doc.id, ...doc.data() });
        });

        // Sort descending
        list.sort((a, b) => {
          const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
          const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
          return dateB - dateA;
        });

        this.myOrders = list;
      } catch (err) {
        console.error("Could not fetch secure telemetry:", err);
      }

      this.loadingMyOrders = false;
      this.renderCartDrawer();
    };

    store.updateQty = function(id, delta) {

      if (!match) return;
      match.quantity += delta;
      if (match.quantity <= 0) {
        this.cart = this.cart.filter(item => item.id !== id);
      }
      localStorage.setItem("bp_cart", JSON.stringify(this.cart));
      this.updateDOM();

    store.getRecommendations = function(purchasedItemIds) {
      const purchasedItems = store.products.filter(p => purchasedItemIds.includes(p.id));
      const purchasedCategories = [...new Set(purchasedItems.map(p => p.category))];
      const purchasedGenders = [...new Set(purchasedItems.map(p => getNormalizedGender(p.gender)))];

      let candidates = store.products.filter(p => !purchasedItemIds.includes(p.id));

      candidates = candidates.map(p => {
        let score = 0;
        if (purchasedCategories.includes(p.category)) score += 3;
        if (purchasedGenders.includes(getNormalizedGender(p.gender))) score += 2;
        if (p.isBestSeller) score += 1;
        return { product: p, score };
      });

      candidates.sort((a, b) => b.score - a.score);

      return candidates.slice(0, 3).map(c => c.product);
    };

    // Chart.js Lazy Loader
    let chartLoaderPromise = null;
    const loadChartLibrary = () => {
      if (chartLoaderPromise) return chartLoaderPromise;
      chartLoaderPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js";
        script.onload = () => resolve(window.Chart);
        script.onerror = () => reject(new Error("Analytics Engine Load Failure"));
        document.head.appendChild(script);
      });
      return chartLoaderPromise;
    };

        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const dateString = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const dayLabel = dayNames[d.getDay()] + " (" + dateString + ")";
          labels.push(dayLabel);
          dailySales[dateString] = 0;
        }

        nonCancelled.forEach(order => {
          if (order.createdAt) {
            const orderDate = order.createdAt.toDate ? order.createdAt.toDate() : new Date(order.createdAt);
            const dateKey = orderDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            if (dailySales[dateKey] !== undefined) {
              dailySales[dateKey] += order.total;
            }
          }
        });

        const dataset = Object.keys(dailySales).map(key => dailySales[key]);

        if (window.analyticsChartInstance) {
          window.analyticsChartInstance.destroy();
        }

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 240);
        gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
        gradient.addColorStop(1, 'rgba(10, 10, 10, 0.05)');

        window.analyticsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Daily Revenue (MAD)',
              data: dataset,
              borderColor: 'var(--accent-color)',
              borderWidth: 3,
              backgroundColor: gradient,
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#000000',
              pointBorderColor: 'var(--accent-color)',
              pointRadius: 6,
              pointHoverRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                grid: { color: 'rgba(212, 175, 55, 0.08)' },
                min: 0,
                beginAtZero: true
              },
              x: { grid: { display: false } }
            }
          }
        });
      }).catch(err => console.error(err));
    };

    store.processCheckout = async function(e) {
      e.preventDefault();
      
      if (this.cart.length === 0) return;
      
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;

      if (!name || !phone || !cityId || !address) {
        showToast("Please fill in all required delivery coordinates.", "error");
        return;
      }

      this.checkoutLoading = true;
      this.updateDOM();

      try {
        const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);
        const cityObj = this.deliveryCities.find(c => c.id === cityId);
        const deliveryFee = cityObj ? cityObj.price : 0;
        const cityName = cityObj ? cityObj.name : "Morocco";
        const total = subtotal + deliveryFee;
        const orderId = "SOV-" + Math.floor(100000 + Math.random() * 900000);

        const orderItems = this.cart.map(item => ({
          id: item.id,
          name: item.name,
          quantity: item.quantity,
          price: item.discountPrice || item.price
        }));

        const newOrder = {
          orderId,
          items: orderItems,
          total,
          subtotal,
          deliveryFee,
          deliveryCity: cityName,
          customerName: name,
          phone,
          address,
          status: "pending",
          paymentMethod: "Telegram Automated",
          createdAt: new Date()
        };

        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        await addDoc(ordersCol, newOrder);

        // Save placed Order ID locally for personalized History Tracking
        const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
        localHistory.push(orderId);
        localStorage.setItem("sovanex_order_history", JSON.stringify(localHistory));

        let productsMsg = "";
        this.cart.forEach(item => {
          productsMsg += "• *" + item.name + "* x" + item.quantity + " (" + (item.discountPrice || item.price) + " MAD)\n";
        });

        let msgText = this.telegramSettings.template
          .replace(/{products}/g, productsMsg.trim())
          .replace(/{subtotal}/g, subtotal)
          .replace(/{city}/g, cityName)
          .replace(/{delivery}/g, deliveryFee)
          .replace(/{total}/g, total)
          .replace(/{name}/g, name)
          .replace(/{address}/g, address)
          .replace(/{phone}/g, phone)
          .replace(/{orderId}/g, orderId);

        if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
          try {
            const telegramUrl = "https://api.telegram.org/bot" + this.telegramSettings.botToken + "/sendMessage";
            await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: this.telegramSettings.chatId,
                text: msgText,
                parse_mode: "Markdown"
              })
            });
          } catch (apiErr) {
            console.error("Direct Telegram bot execution failed.", apiErr);
          }
        }

        const purchasedItemIds = this.cart.map(item => item.id);
        const recommendations = store.getRecommendations(purchasedItemIds);

        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "" };
        this.cartOpen = false;
        this.checkoutLoading = false;
        
        let recommendationsMarkup = "";
        if (recommendations.length > 0) {
          recommendationsMarkup = `
            <!-- Inline style to hide default confirm buttons -->
            <style>
              #confirm-submit-btn { display: none !important; }

            <div class="mt-8 border-t border-luxuryGold/20 pt-6 space-y-4">
              <p class="text-[11px] uppercase tracking-[0.2em] text-luxuryGold font-extrabold mb-2">✨ Curated Exclusives for You ✨</p>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">

                  return `
                    <div class="bg-black/40 p-2.5 rounded-xl border border-luxuryGold/10 flex flex-col justify-between items-center text-center">
                      <img src="${rec.imageURL || fallbackImage}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-lg border border-luxuryGold/15 mb-2">
                      <div class="flex-1 flex flex-col justify-between w-full">
                        <div>
                          <p class="text-[10px] font-bold text-white line-clamp-1">${cleanRecName}</p>
                          <p class="text-[10px] text-luxuryGold font-medium mt-0.5">${rec.price} MAD</p>
                        </div>
                        <button class="rec-view-product-btn mt-2 w-full py-1 bg-luxuryGold/10 hover:bg-luxuryGold text-luxuryGold hover:text-black border border-luxuryGold/30 text-[9px] uppercase font-extrabold tracking-wider rounded-md transition" data-id="${rec.id}">
                          View Product

                  Continue Shopping
                </button>

          `;

        triggerConfirm(

          '<div class="space-y-4 text-center">' +

            '<div class="bg-black/50 p-4 rounded-xl border border-luxuryGold/20 max-w-xs mx-auto">' +

            recommendationsMarkup +
          '</div>', 
          () => {
            store.setPage("home");
          },
          true
        );

        setTimeout(() => {
          document.querySelectorAll(".rec-view-product-btn").forEach(btn => {
            btn.onclick = (e) => {
              e.preventDefault();
              const recId = btn.getAttribute("data-id");
              const modalConfirm = document.getElementById("confirm-modal-container");
              if (modalConfirm) modalConfirm.classList.add("hidden");

    store.bindProductCardClicks = function() {
      document.querySelectorAll(".card-img-trigger, .card-title-trigger").forEach(el => {
        el.onclick = () => {
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.openProductDetailsModal(prod);
        };
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) store.addToCart(prod);
        };
      });

      document.querySelectorAll(".order-now-btn").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-id");
          const prod = store.products.find(p => p.id === id);
          if (prod) {
            store.cart = [{ ...prod, quantity: 1 }];
            localStorage.setItem("bp_cart", JSON.stringify(store.cart));
            store.setPage("cart");
          }
        };
      });
    };

    store.renderAdminProfitCalculator = function(container) {
      const deliveredOrders = this.orders.filter(o => o.status === "processed");
      const totalDeliveredRevenue = deliveredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
      const totalDeliveredCount = deliveredOrders.length || 1;
      
      const lifetimeAOV = Math.round(totalDeliveredRevenue / totalDeliveredCount) || 1100;

      let totalItemsSold = 0;
      deliveredOrders.forEach(o => {
        if (o.items) {
          o.items.forEach(item => {
            totalItemsSold += (item.quantity || 0);
          });
        }
      });

      const inLeads = document.getElementById("input-leads-bk");

      const inPieces = document.getElementById("input-pieces-bk");

      const lblLeads = document.getElementById("lbl-leads-bk");
      const lblCpl = document.getElementById("lbl-cpl-bk");
      const lblConfirm = document.getElementById("lbl-confirm-bk");
      const lblDelivery = document.getElementById("lbl-delivery-bk");
      const lblProdCost = document.getElementById("lbl-productcost-bk");
      const lblAov = document.getElementById("lbl-aov-bk");
      const lblPieces = document.getElementById("lbl-pieces-bk");

      const outBkCpl = document.getElementById("out-bk-cpl");
      const outBkDelivery = document.getElementById("out-bk-delivery");
      const outBkConfirm = document.getElementById("out-bk-confirm");
      const outBkAov = document.getElementById("out-bk-aov");

      const outScRevenue = document.getElementById("out-sc-revenue");
      const outScAdcost = document.getElementById("out-sc-adcost");

      const outScDelcost = document.getElementById("out-sc-delcost");

      const outScTotcost = document.getElementById("out-sc-totcost");
      const outScNetprofit = document.getElementById("out-sc-netprofit");
      const outScMargin = document.getElementById("out-sc-margin");

      const outScConfirmedQty = document.getElementById("out-sc-confirmedqty");
      const outScDeliveredQty = document.getElementById("out-sc-deliveredqty");
      const outScReturnedQty = document.getElementById("out-sc-returnedqty");

      const recalculateMetrics = () => {
        const leads = Number(inLeads.value);
        const cpl = Number(inCpl.value);
        const confirmRate = Number(inConfirm.value) / 100;
        const deliveryRate = Number(inDelivery.value) / 100;
        const rawProductCost = Number(inProdCost.value);
        const unitPrice = Number(inAov.value);
        const pieces = Number(inPieces.value);

        const calculatedAOV = unitPrice * pieces;
        const productCostPerOrder = rawProductCost * pieces; // COGS = Cost per piece * average pieces per order

        lblLeads.textContent = leads.toLocaleString('en-US');
        lblCpl.textContent = cpl + " MAD";
        lblConfirm.textContent = inConfirm.value + "%";
        lblDelivery.textContent = inDelivery.value + "%";
        lblProdCost.textContent = rawProductCost + " MAD";
        lblAov.textContent = unitPrice + " MAD";
        lblPieces.textContent = pieces;

        const calcAovEl = document.getElementById("lbl-calculated-aov");
        if (calcAovEl) {
          calcAovEl.textContent = Math.round(calculatedAOV) + " MAD";
        }

        const deliveryFee = 0; // Fully covered by client
        const returnFee = 0;   // Free returns

        const expectedConfirmed = leads * confirmRate;
        const expectedDelivered = expectedConfirmed * deliveryRate;
        const expectedReturned = expectedConfirmed * (1 - deliveryRate);

        const scAdCost = leads * cpl;
        const scRevenue = expectedDelivered * calculatedAOV;
        
        const scProductCost = expectedDelivered * productCostPerOrder; 
        
        const scDeliveryCost = expectedDelivered * deliveryFee;
        const scReturnCost = expectedReturned * returnFee;

        const scTotalCosts = scAdCost + scProductCost + scDeliveryCost + scReturnCost;
        const scNetProfit = scRevenue - scTotalCosts;
        const scMargin = scRevenue > 0 ? (scNetProfit / scRevenue) * 100 : 0;

        outScRevenue.textContent = Math.round(scRevenue).toLocaleString('en-US') + " MAD";
        outScAdcost.textContent = Math.round(scAdCost).toLocaleString('en-US') + " MAD";
        outScProdcost.textContent = Math.round(scProductCost).toLocaleString('en-US') + " MAD";
        outScDelcost.textContent = Math.round(scDeliveryCost).toLocaleString('en-US') + " MAD";
        outScRetcost.textContent = Math.round(scReturnCost).toLocaleString('en-US') + " MAD";
        outScTotcost.textContent = Math.round(scTotalCosts).toLocaleString('en-US') + " MAD";
        
        outScNetprofit.textContent = Math.round(scNetProfit).toLocaleString('en-US') + " MAD";
        outScNetprofit.className = scNetProfit >= 0 ? "text-2xl sm:text-3xl font-serif font-bold text-emerald-400 mt-1" : "text-2xl sm:text-3xl font-serif font-bold text-red-400 mt-1";
        
        outScMargin.textContent = scMargin.toFixed(1) + "%";
        outScMargin.className = scMargin >= 0 ? "text-2xl sm:text-3xl font-serif font-bold text-emerald-400 mt-1" : "text-2xl sm:text-3xl font-serif font-bold text-red-400 mt-1";

        outScConfirmedQty.textContent = Math.round(expectedConfirmed).toLocaleString('en-US');
        outScDeliveredQty.textContent = Math.round(expectedDelivered).toLocaleString('en-US');
        outScReturnedQty.textContent = Math.round(expectedReturned).toLocaleString('en-US');

        // New Breakeven formulas based on: Net Profit = CR * DR * (AOV - Cost_order) - CPL = 0
        const profitMarginPerOrder = calculatedAOV - productCostPerOrder;

        const bkCpl = confirmRate * deliveryRate * profitMarginPerOrder;
        outBkCpl.textContent = bkCpl > 0 ? bkCpl.toFixed(1) + " MAD" : "Infeasible";

        const bkDelivery = profitMarginPerOrder > 0 ? (cpl / (confirmRate * profitMarginPerOrder)) * 100 : 0;
        outBkDelivery.textContent = (bkDelivery > 0 && bkDelivery <= 100) ? bkDelivery.toFixed(1) + "%" : "Infeasible";

        const bkConfirm = profitMarginPerOrder > 0 ? (cpl / (deliveryRate * profitMarginPerOrder)) * 100 : 0;
        outBkConfirm.textContent = (bkConfirm > 0 && bkConfirm <= 100) ? bkConfirm.toFixed(1) + "%" : "Infeasible";

        const bkAov = (cpl / (confirmRate * deliveryRate)) + productCostPerOrder;
        outBkAov.textContent = bkAov > 0 ? Math.round(bkAov) + " MAD" : "Infeasible";
      };

      [inLeads, inCpl, inConfirm, inDelivery, inProdCost, inAov, inPieces].forEach(el => {
        el.oninput = recalculateMetrics;
      });

      recalculateMetrics();
    };

    store.fetchMyOrdersOnPage = async function() {
      const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
      if (localHistory.length === 0) {
        this.myOrders = [];
        this.loadingMyOrders = false;
        this.renderCartPage();
        return;
      }

      this.loadingMyOrders = true;
      this.renderCartPage();

      try {
        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const q = query(ordersCol, where("orderId", "in", localHistory.slice(-10)));
        const snap = await getDocs(q);
        const list = [];
        snap.forEach(doc => {
          list.push({ id: doc.id, ...doc.data() });
        });

        list.sort((a, b) => {
          const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
          const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
          return dateB - dateA;
        });

        this.myOrders = list;
      } catch (err) {
        console.error("Order history fetch failed:", err);
      }

      this.loadingMyOrders = false;
      this.renderCartPage();
    };

    store.processCheckoutPage = async function(e) {
      const formEl = e.target;
      const name = formEl.customerName.value;
      const phone = formEl.phone.value;
      const cityId = formEl.cityId.value;
      const address = formEl.address.value;

      if (!name || !phone || !cityId || !address) {
        showToast("Please fill in all required delivery coordinates.", "error");
        return;
      }

      this.checkoutLoading = true;
      this.renderCartPage();

      try {
        const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);
        const cityObj = this.deliveryCities.find(c => c.id === cityId);
        const deliveryFee = cityObj ? cityObj.price : 0;
        const cityName = cityObj ? cityObj.name : "Morocco";
        const total = subtotal + deliveryFee;
        const orderId = "SOV-" + Math.floor(100000 + Math.random() * 900000);

        const orderItems = this.cart.map(item => ({
          id: item.id,
          name: item.name,
          quantity: item.quantity,
          price: item.discountPrice || item.price
        }));

        const newOrder = {
          orderId,
          items: orderItems,
          total,
          subtotal,
          deliveryFee,
          deliveryCity: cityName,
          customerName: name,
          phone,
          address,
          status: "pending",
          paymentMethod: "Telegram Automated",
          createdAt: new Date()
        };

        const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        await addDoc(ordersCol, newOrder);

        const localHistory = JSON.parse(localStorage.getItem("sovanex_order_history")) || [];
        localHistory.push(orderId);
        localStorage.setItem("sovanex_order_history", JSON.stringify(localHistory));

        const purchasedItemIds = this.cart.map(item => item.id);
        localStorage.setItem("sovanex_last_purchased_ids", JSON.stringify(purchasedItemIds));

        if (typeof fbq !== 'undefined') {
          fbq('track', 'Purchase', {
            value: total,
            currency: 'MAD',
            contents: orderItems.map(item => ({ id: item.id, quantity: item.quantity })),
            content_type: 'product'
          });
        }

        let productsMsg = "";
        this.cart.forEach(item => {
          productsMsg += "• *" + item.name + "* x" + item.quantity + " (" + (item.discountPrice || item.price) + " MAD)\n";
        });

        let msgText = this.telegramSettings.template
          .replace(/{products}/g, productsMsg.trim())
          .replace(/{subtotal}/g, subtotal)
          .replace(/{city}/g, cityName)
          .replace(/{delivery}/g, deliveryFee)
          .replace(/{total}/g, total)
          .replace(/{name}/g, name)
          .replace(/{address}/g, address)
          .replace(/{phone}/g, phone)
          .replace(/{orderId}/g, orderId);

        if (this.telegramSettings.botEnabled && this.telegramSettings.botToken && this.telegramSettings.chatId) {
          try {
            const telegramUrl = "https://api.telegram.org/bot" + this.telegramSettings.botToken + "/sendMessage";
            await fetch(telegramUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: this.telegramSettings.chatId,
                text: msgText,
                parse_mode: "Markdown"
              })
            });
          } catch (apiErr) {
            console.error("Telegram delivery bypassed:", apiErr);
          }
        }

        this.cart = [];
        localStorage.setItem("bp_cart", JSON.stringify([]));
        this.checkoutFormValues = { customerName: "", phone: "", cityId: "", address: "" };
        this.checkoutLoading = false;

        this.setPage("order-confirmation");

      } catch (err) {
        console.error(err);
        this.checkoutLoading = false;
        showToast("Order checkout pipeline failed. Please try again.", "error");
        this.renderCartPage();
      }
    };

            <div class="md:w-1/2 h-[35%] sm:h-[40%] md:h-auto relative overflow-hidden flex-shrink-0 group/main cursor-zoom-in" id="zoom-img-btn">
              <img src="${this.activeImg || fallbackImage}" class="w-full h-full object-cover transition-premium transform group-hover/main:scale-105">
              ${product.isPromotion ? `<span class="absolute top-4 left-4 bg-red-700 text-white text-[10px] uppercase font-bold tracking-widest px-3 py-1 rounded-full shadow-lg">Collection Sale</span>` : ''}
              
              <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-luxuryGold/40 text-luxuryGold text-[9px] uppercase font-bold tracking-widest flex items-center gap-1.5 pointer-events-none animate-pulse">
                <span>${this.t('tapToZoom')}</span>
              </div>

              <div class="absolute inset-0 bg-black/35 opacity-0 group-hover/main:opacity-100 transition flex items-center justify-center">
                <span class="bg-black/90 backdrop-blur-md text-luxuryGold text-xs uppercase tracking-widest font-extrabold px-4 py-2 rounded-full flex items-center gap-2 border border-luxuryGold/35">${this.t('quickView')}</span>
              </div>
            </div>

            <!-- Details Container -->
            <div class="md:w-1/2 p-5 md:p-8 flex flex-col justify-between overflow-y-auto space-y-4 min-h-0 flex-grow h-[65%] sm:h-[60%] md:h-auto">
              <div class="space-y-4">
                <div class="flex justify-between items-center">
                  <span class="text-xs uppercase tracking-widest text-luxuryGold font-semibold text-luxuryGold">${product.category}</span>
                  ${normalizedGender === 'Men\'s Packs' || normalizedGender === 'Women\'s Packs' ? `<span class="px-2.5 py-1 rounded-full text-[9px] font-bold bg-luxuryGold text-black">Packs</span>` : ''}
                </div>
                <h2 class="text-xl md:text-3xl font-serif text-white font-bold tracking-tight">${cleanName}</h2>
                
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1">
                    <span class="text-amber-500">${"★".repeat(Math.round(product.rating || 5))}</span>
                    <span class="text-xs text-gray-300 font-semibold ml-1">${product.rating || 5.0} (${product.reviewsCount || 0} reviews)</span>
                  </div>
                  <button id="modal-share-btn" class="flex items-center gap-1.5 px-3 py-1.5 bg-white/5 hover:bg-white/10 text-gray-300 hover:text-luxuryGold border border-white/10 rounded-lg text-[10px] uppercase font-bold tracking-wider transition">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    ${this.t('shareLink')}
                  </button>
                </div>

                <div class="flex items-baseline gap-3 pt-1">
                  ${product.discountPrice ? `
                    <span class="text-xl md:text-3xl font-serif font-bold text-luxuryGold">${product.discountPrice} MAD</span>
                    <span class="text-xs line-through text-gray-500">${product.price} MAD</span>
                  ` : `<span class="text-xl md:text-3xl font-serif font-bold text-white">${product.price} MAD</span>`}
                </div>

                <div class="border-t border-b border-luxuryGold/20 py-3 space-y-2">
                  <p class="text-[10px] font-semibold text-luxuryGold uppercase tracking-wider">Gallery</p>
                  <div class="flex gap-2.5 overflow-x-auto py-1 hide-scrollbar">
                    ${galleryMarkup}
                  </div>
                </div>

                <p class="text-xs md:text-sm text-gray-300 leading-relaxed font-light">${product.description}</p>
                <p class="text-[11px] font-medium text-gray-400">
                  Stock Status: ${product.limitedStock ? `<span class="text-red-400 font-bold">Limited Reserve (${product.stock} left)</span>` : `<span class="text-emerald-400 font-bold">In Stock</span>`}
                </p>
              </div>

              <div class="space-y-3 pt-3 border-t border-white/5 flex-shrink-0">
                <div class="grid grid-cols-2 gap-3">
                  <button id="modal-add-to-cart-btn" class="py-2.5 md:py-3.5 border border-luxuryGold text-luxuryGold hover:bg-luxuryGold hover:text-black font-extrabold uppercase tracking-widest text-[10px] md:text-[11px] rounded-xl transition shadow-xs">${this.t('addToCart')}</button>
                  <button id="modal-order-now-btn" class="py-2.5 md:py-3.5 bg-luxuryGold hover:bg-luxuryGold/90 text-black font-extrabold uppercase tracking-widest text-[10px] md:text-[11px] rounded-xl transition transform hover:scale-[1.02]">${this.t('orderNow')}</button>
                </div>
                <p class="text-[9px] md:text-[10px] text-center text-gray-500">${this.t('customCardTip')}</p>
              </div>
            </div>
          </div>
        `;

        const closeModal = () => {
          modal.classList.add("hidden");
          window.location.hash = '#/' + store.currentPage;
        };

        document.getElementById("product-modal-backdrop").onclick = closeModal;
        document.getElementById("product-modal-close").onclick = closeModal;

        const mainThumb = document.getElementById("main-thumb-btn");
        if (mainThumb) {
          mainThumb.onclick = () => {
            store.activeImg = product.imageURL;
            renderInsideModal();
          };
        }

        document.querySelectorAll("[data-url]").forEach(btn => {
          btn.onclick = () => {
            store.activeImg = btn.getAttribute("data-url");
            renderInsideModal();
          };
        });

        document.getElementById("zoom-img-btn").onclick = () => {
          const lightbox = document.getElementById("lightbox-container");
          if (!lightbox) return;
          lightbox.innerHTML = `
            <button id="lightbox-close" class="absolute top-6 right-6 z-50 p-3 text-white bg-white/10 hover:bg-white/20 rounded-full transition-premium">✕</button>
            <div class="max-w-4xl w-full h-full max-h-[85vh] flex items-center justify-center p-4">
              <img src="${store.activeImg || fallbackImage}" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl border-2 border-luxuryGold/30">
            </div>
          `;
          lightbox.classList.remove("hidden");
          document.getElementById("lightbox-close").onclick = () => lightbox.classList.add("hidden");
        };

        document.getElementById("modal-share-btn").onclick = (e) => {
          e.stopPropagation();
          const shareUrl = window.location.origin + window.location.pathname + '#/product/' + product.id;
          store.copyTextToClipboard(shareUrl);
        };

        document.getElementById("modal-add-to-cart-btn").onclick = () => {
          store.addToCart(product);
          closeModal();
        };

        document.getElementById("modal-order-now-btn").onclick = () => {
          store.cart = [{ ...product, quantity: 1 }];
          localStorage.setItem("bp_cart", JSON.stringify(store.cart));
          closeModal();
          store.setPage("cart");
        };
      };

      renderInsideModal();
      modal.classList.remove("hidden");
    };

    store.renderFloatingActions = function() {
      const container = document.getElementById("floating-actions");
      if (!container) return;
      const cartCount = this.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = this.cart.reduce((sum, item) => sum + ((item.discountPrice || item.price) * item.quantity), 0);

      container.innerHTML = `
        <!-- Floating WhatsApp Help Chat Action -->
        <a href="https://wa.me/${(this.settings.whatsappHotline || '212777467304').replace(/\s+/g, '')}" target="_blank" class="fixed bottom-6 left-6 z-40 bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition hover:scale-110" title="Chat with Support on WhatsApp">
          ${getIconSvg('message-circle', 'w-6 h-6')}
        </a>

        <!-- Sticky Mobile cart CTA bar -->
        ${cartCount > 0 ? `
          <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#141414]/95 border-t border-luxuryGold/30 px-6 py-4 flex items-center justify-between shadow-xl animate-fade-in">
            <div class="flex items-center gap-2">
              ${getIconSvg('shopping-bag', 'text-luxuryGold w-5 h-5')}
              <div>
                <p class="text-[10px] text-gray-400">Your Selection</p>
                <p class="text-xs font-bold text-luxuryGold">${subtotal} MAD</p>
              </div>
            </div>
            <button id="sticky-mobile-checkout-btn" class="bg-luxuryGold text-black px-4 py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider">Order Now</button>
          </div>
        ` : ''}
      `;

      const stickyBtn = document.getElementById("sticky-mobile-checkout-btn");
      if (stickyBtn) {
        stickyBtn.onclick = () => {
          store.setPage("cart");
        };
      }
    };

    const hidePreloader = () => {
      const preloader = document.getElementById('app-preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        preloader.style.visibility = 'hidden';
        setTimeout(() => preloader.remove(), 400);
      }
    };

    const preloaderTimeout = setTimeout(hidePreloader, 1200);

    async function initAppSequence() {
      try {
        let user = auth.currentUser;
        if (!user) {
          const customToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (customToken) {
            try {
              const credential = await signInWithCustomToken(auth, customToken);
              user = credential.user;
            } catch (tokenError) {
              console.warn("Firebase Auth: Custom token mismatch. Bypassing to Anonymous Authentication.", tokenError);
              const credential = await signInAnonymously(auth);
              user = credential.user;
            }
          } else {
            const credential = await signInAnonymously(auth);
            user = credential.user;
          }
        }
        
        if (user) {
          store.user = user;
          store.initPublicSubscriptions();
          if (store.isAdmin) {
            store.initAdminSubscriptions();
          }
        }
      } catch (error) {
        console.error("Firebase Auth Failure:", error);
        
        if (error.code === 'auth/operation-not-allowed') {
          showFirebaseDiagnosticModal(
            "Anonymous Auth Disabled",
            "SOVANEX cannot identify connection credentials because 'Anonymous Sign-In' is disabled inside your Firebase Console."
          );
        } else {
          showFirebaseDiagnosticModal(
            "Firebase Initialization Alert",
            "Authentication returned: " + error.message + ". Ensure your Firestore Rules allow connection access."
          );
        }

        store.initPublicSubscriptions(true); 
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      store.updateDOM();

      initAppSequence().then(() => {
        clearTimeout(preloaderTimeout);
        hidePreloader();
        
        store.handleRouting();
      });

      window.addEventListener("hashchange", () => {
        store.handleRouting();
      });

      onAuthStateChanged(auth, (usr) => {
        if (usr) {
          store.user = usr;

          // Admin Privileges Guard Pre-Check
          if (usr.email === "bilalotami@gmail.com") {
            store.isAdmin = true;
          } else {
            store.isAdmin = false;
            if (usr.email && usr.email !== "bilalotami@gmail.com") {
              signOut(auth).then(() => {
                showToast("Unauthorized account. Signed out.", "error");
                signInAnonymously(auth).catch(console.error);
                if (store.currentPage === "admin") store.setPage("home");
              });
              return;
            }
          }

          store.initPublicSubscriptions();
          
          if (store.isAdmin) {
            store.initAdminSubscriptions();
            if (store.currentPage === "admin") {
              store.renderAdminPage();
            }
          }
        } else {
           signInAnonymously(auth).catch(console.error);
        }
      });
    });
  </script>
</body>
</html>
